function renderAudienceManual(main){
  const groups = state.audienceGroups;
  const results = runAudience(groups);
  main.innerHTML = `
    <div class="card" style="padding:18px;">
      <div id="groupsWrap"></div>
      <button class="btn btn-sm" id="addGroupBtn" style="margin-top:2px;">${ICON.plus}Add OR group</button>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:18px; padding-top:14px; border-top:1px solid var(--line);">
        <div class="mono" style="font-size:13px;" id="matchCountLine">Matches <b style="font-size:16px;">${results.length}</b> of ${CUSTOMERS.length} accounts</div>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-sm" id="saveAudBtn">${ICON.save}Save audience</button>
          <button class="btn btn-sm btn-accent" id="launchAudBtn" ${results.length?'':'disabled'}>${ICON.play}Launch agent</button>
        </div>
      </div>
    </div>
    <div class="card" style="padding:6px 14px 4px; margin-top:16px;">
      <table>
        <thead><tr><th>Account</th><th>Lifecycle</th><th>Segment</th><th>Health</th><th>Owner</th></tr></thead>
        <tbody id="audResultBody"></tbody>
      </table>
      <div id="audEmptyState"></div>
    </div>
  `;
  const groupsWrap = document.getElementById('groupsWrap');

  const renderGroups = ()=>{
    groupsWrap.innerHTML = groups.map((g,gi)=>`
      ${gi>0 ? `<div class="or-divider"><span>OR</span></div>` : ''}
      <div class="aud-group" data-group="${gi}">
        <div class="aud-group-head">
          <span class="mono" style="font-size:11px; color:var(--ink-faint); font-weight:600;">CONDITIONS MATCH ALL OF</span>
          ${groups.length>1 ? `<button class="rm" data-rmgroup="${gi}" title="Remove group">${ICON.x}</button>` : ''}
        </div>
        <div class="filter-rows-inner" data-rows="${gi}"></div>
        <button class="btn btn-sm btn-ghost" data-addcond="${gi}" style="margin-top:2px;">${ICON.plus}Add condition</button>
      </div>
    `).join('');

    groups.forEach((g,gi)=>{
      const rowsEl = groupsWrap.querySelector(`[data-rows="${gi}"]`);
      rowsEl.innerHTML = g.length ? g.map((f,fi)=>{
        const m = fieldMeta(f.field);
        const opOptions = m.type==='enum' ? [['is','is'],['isnot','is not']] : [['lt','less than'],['gt','greater than'],['eq','equals']];
        return `<div class="filter-row" data-row="${fi}">
          <select class="fld">${AUD_FIELDS.map(fm=>`<option value="${fm.key}" ${fm.key===f.field?'selected':''}>${fm.label}</option>`).join('')}</select>
          <select class="op">${opOptions.map(([v,l])=>`<option value="${v}" ${v===f.op?'selected':''}>${l}</option>`).join('')}</select>
          ${m.type==='enum'
            ? `<select class="val">${m.options.map(o=>`<option value="${o}" ${o===f.value?'selected':''}>${m.display?m.display(o):o}</option>`).join('')}</select>`
            : `<input class="val" type="number" value="${f.value}"/>`}
          <button class="rm" data-rm="${fi}">${ICON.x}</button>
        </div>`;
      }).join('') : `<div style="font-size:11.5px; color:var(--ink-faint); padding:4px 0 8px;">No conditions yet — add one below (an empty group matches every account).</div>`;
      rowsEl.querySelectorAll('[data-row]').forEach(row=>{
        const fi = Number(row.dataset.row);
        const fldSel = row.querySelector('.fld'), opSel = row.querySelector('.op'), valEl = row.querySelector('.val');
        fldSel.addEventListener('change', ()=>{ const nm=fieldMeta(fldSel.value); g[fi]={field:fldSel.value, op:nm.type==='enum'?'is':'lt', value: nm.type==='enum'?nm.options[0]:0}; renderGroups(); refreshResults(); });
        opSel.addEventListener('change', ()=>{ g[fi].op = opSel.value; refreshResults(); });
        valEl.addEventListener('input', ()=>{ g[fi].value = valEl.value; refreshResults(); });
      });
      rowsEl.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click', ()=>{ g.splice(Number(b.dataset.rm),1); renderGroups(); refreshResults(); }));
    });

    groupsWrap.querySelectorAll('[data-addcond]').forEach(b=>b.addEventListener('click', ()=>{ groups[Number(b.dataset.addcond)].push({field:'score', op:'lt', value:60}); renderGroups(); refreshResults(); }));
    groupsWrap.querySelectorAll('[data-rmgroup]').forEach(b=>b.addEventListener('click', ()=>{ groups.splice(Number(b.dataset.rmgroup),1); renderGroups(); refreshResults(); }));
  };

  const refreshResults = ()=>{
    const res = runAudience(groups);
    document.getElementById('matchCountLine').innerHTML = `Matches <b style="font-size:16px;">${res.length}</b> of ${CUSTOMERS.length} accounts`;
    document.getElementById('launchAudBtn').disabled = !res.length;
    fillResultTable(res);
  };
  const fillResultTable = (res)=>{
    const body = document.getElementById('audResultBody');
    body.innerHTML = res.slice(0,12).map(c=>{ const band=custBand(c);
      return `<tr class="clickable" data-cust3="${c.id}"><td><div class="cust-name"><div class="avatar">${c.initials}</div><span class="n">${c.name}</span></div></td><td>${c.lifecycle}</td><td>${c.segment}</td><td><span class="score-badge" data-asd="${c.id}" title="Open Advanced Score Dashboard" style="background:${band.tint}; color:${band.color}">${c.score}</span></td><td>${c.owner}</td></tr>`;
    }).join('') + (res.length>12 ? `<tr><td colspan="5" style="text-align:center; color:var(--ink-faint); font-size:12px;">+ ${res.length-12} more</td></tr>` : '');
    body.querySelectorAll('[data-cust3]').forEach(tr=>tr.addEventListener('click', ()=>openCustomerDrawer(tr.dataset.cust3)));
    document.getElementById('audEmptyState').innerHTML = res.length===0 ? `<div class="empty-state">${ICON.target}<h4>No matches</h4><p>Try loosening a condition, or removing a group.</p></div>` : '';

function parseAudiencePrompt(text){
  const t = text.toLowerCase();
  const filters = [];
  LIFECYCLES.forEach(l=>{ if(t.includes(l.toLowerCase())) filters.push({field:'lifecycle', op:'is', value:l}); });
  if(t.includes('enterprise')) filters.push({field:'segment', op:'is', value:'Enterprise'});
  if(t.includes('mid-market')||t.includes('mid market')) filters.push({field:'segment', op:'is', value:'Mid-Market'});
  if(t.includes('smb')||t.includes('small business')) filters.push({field:'segment', op:'is', value:'SMB'});
  if(t.includes('at risk')||t.includes('at-risk')) filters.push({field:'band', op:'is', value:'atrisk'});
  else if(t.includes('critical')) filters.push({field:'band', op:'is', value:'critical'});
  else if(t.includes('thriving')||t.includes('healthy')) filters.push({field:'band', op:'is', value:'thriving'});
  else if(t.includes('stable')) filters.push({field:'band', op:'is', value:'stable'});
  let m;
  if((m = t.match(/(?:score\s*)?(?:below|under|less than)\s*(\d+)/))) filters.push({field:'score', op:'lt', value:m[1]});
  if((m = t.match(/(?:score\s*)?(?:above|over|more than|greater than)\s*(\d+)(?!\s*day)/))) filters.push({field:'score', op:'gt', value:m[1]});
  if((m = t.match(/no meeting in (\d+)|haven.t had a meeting in (\d+)|last meeting (?:over|more than) (\d+)/))) filters.push({field:'lastMeetingDays', op:'gt', value:m[1]||m[2]||m[3]});
  if((m = t.match(/no(?:t)? logg?ed in (?:in )?(\d+)|haven.t logged in (\d+)/))) filters.push({field:'lastLoginDays', op:'gt', value:m[1]||m[2]});
  if((m = t.match(/renewing in (?:the next )?(\d+)|renewal (?:within|in the next) (\d+)/))) filters.push({field:'renewalInDays', op:'lt', value:m[1]||m[2]});
  if((m = t.match(/more than (\d+) (?:open )?tickets/))) filters.push({field:'openTickets', op:'gt', value:m[1]});
  return {filters};
}

function findStepById(id){
  const steps = state.builderAgent.steps;
  for(const s of steps){
    if(s.id===id) return s;
    if(s.type==='condition'){
      const f = (s.config.yes||[]).concat(s.config.no||[]).find(x=>x.id===id);
      if(f) return f;
    }
  }
  return null;
}
function listAtAddress(addr){
  if(addr.kind==='root') return state.builderAgent.steps;
  const cond = state.builderAgent.steps.find(s=>s.id===addr.stepId);
  return cond.config[addr.branch];
}
function deleteStepById(id){
  let list = state.builderAgent.steps;
  let idx = list.findIndex(s=>s.id===id);
  if(idx>-1){ list.splice(idx,1); return; }
  for(const s of state.builderAgent.steps){
    if(s.type==='condition'){
      ['yes','no'].forEach(b=>{
        const i = (s.config[b]||[]).findIndex(x=>x.id===id);
        if(i>-1) s.config[b].splice(i,1);
      });
    }
  }
}

function buildStepListHTML(list, ctx, allowCondition){
  const addKey = (idx)=> ctx.kind==='root' ? `root:${idx}` : `branch:${ctx.stepId}:${ctx.branch}:${idx}`;
  const addr = (idx)=> ctx.kind==='root' ? {kind:'root', index:idx} : {kind:'branch', stepId:ctx.stepId, branch:ctx.branch, index:idx};
  const addBtn = (idx)=>{
    const key = addKey(idx);
    const open = state.openAddMenuKey===key;
    return `<div class="flow-add" data-addkey="${key}"><div class="plus">${ICON.plus}</div><span class="lbl">Add step</span></div>
      ${open ? `<div class="node-type-menu show" style="position:static; margin:2px 0 8px 15px; box-shadow:none; border:1px solid var(--line);">
        ${NODE_MENU_TYPES.filter(nt=>allowCondition || !nt.rootOnly).map(nt=>{
          const st=STEP_STYLE[nt.type];
          return `<button data-addtype="${nt.type}" data-addr='${JSON.stringify(addr(idx))}'><span class="ic" style="background:${st.bg}; color:${st.fg};">${ICON[st.icon]}</span>${nt.label}</button>`;
        }).join('')}
      </div>` : ''}`;
  };
  const connector = `<div class="flow-connector"></div>`;
  let html = addBtn(0);
  list.forEach((s,i)=>{
    html += connector + stepNodeHTML(s) + connector + addBtn(i+1);
  });
  return html;
}

function stepNodeHTML(s){
  const st = STEP_STYLE[s.type];
  const selected = state.builderSelectedStepId===s.id;
  let sub = describeStep(s);
  let extra = '';
  if(s.type==='condition'){
    extra = `<div class="branch-wrap">
      <div class="branch-col"><span class="branch-tag yes">If Yes</span>${buildStepListHTML(s.config.yes, {kind:'branch', stepId:s.id, branch:'yes'}, false)}</div>
      <div class="branch-col"><span class="branch-tag no">If No</span>${buildStepListHTML(s.config.no, {kind:'branch', stepId:s.id, branch:'no'}, false)}</div>

  }
  return `<div class="flow-node ${selected?'selected':''}" data-node="${s.id}">
      <div class="ic" style="background:${st.bg}; color:${st.fg};">${ICON[st.icon]}</div>
      <div class="body"><div class="ttl">${st.label}</div><div class="sub" title="${sub}">${sub}</div></div>

}

function buildAgentFromPrompt(text){
  const clauses = text.split(/,| then | and then |;/i).map(c=>c.trim()).filter(Boolean);
  const steps = [];
  let ifMode = false, ifBucket = null;
  clauses.forEach(raw=>{
    const c = raw.toLowerCase();
    let m;
    if(c.startsWith('if ') || c.includes(" if ")){
      const cond = step('condition', {field: raw.replace(/^.*if\s+/i,'').replace(/hasn.t|haven.t/i,'not').trim() || 'Condition met', operator:'is', value:'true', yes:[], no:[]});
      steps.push(cond); ifMode = true; ifBucket = cond.config.yes; return;
    }
    let s = null;
    if((m = c.match(/wait (\d+)\s*(day|days|hour|hours)/))) s = step('wait', {duration:Number(m[1]), unit:m[2].startsWith('hour')?'hours':'days'});
    else if(c.includes('email')) s = step('email', {template: EMAIL_TEMPLATES.find(t=>c.includes(t.name.toLowerCase().split(' ')[0]))?.name || 'Usage Dip Re-engagement', offset:'Day 1'});
    else if(c.includes('call the') || c.includes('api') || c.includes('escalat')) s = step('api', {method:'POST', endpoint:'/v1/accounts/{id}/escalate', payload:'{ "reason": "agent_condition" }'});
    else if(c.includes('task') || c.includes('create a task')) s = step('task', {title: raw.replace(/^(then\s+)?(create a task( for the csm)? to |create a task( for the csm)?)/i,'').trim() || 'Follow up task', owner:'CSM', offset:'Day 2'});
    if(s){ (ifMode ? ifBucket : steps).push(s); }
  });
  return steps;
}

function timeAgo(ts){
  const s = Math.max(0, Math.round((Date.now()-ts)/1000));
  if(s<5) return 'just now';
  if(s<60) return s+'s ago';
  const m = Math.round(s/60); if(m<60) return m+'m ago';
  const h = Math.round(m/60); if(h<24) return h+'h ago';
  return Math.round(h/24)+'d ago';
}

const ASD_CACHE = {};
const ASD_SHORT = {telemetry:'Usage', survey:'Survey', meetings:'Meetings', tickets:'Tickets', renewal:'Renewal', crm:'CRM', hygiene:'Hygiene'};
const asdClamp = (v,a,b)=>Math.max(a,Math.min(b,v));
function asdRange(m, c){ const k = m.seg ? ASD_SEG_SCALE[c.segment] : 1; return [m.worst*k, m.best*k]; }
function asdRaw(m, c, score){ const [w,b] = asdRange(m,c); return w + (b-w)*score/100; }
function asdScoreFromRaw(m, c, raw){ const [w,b] = asdRange(m,c); return asdClamp((raw-w)/(b-w)*100, 2, 100); }
function asdFmt(m, v){
  if(m.money) return '$'+(v>=1000?(v/1000).toFixed(0)+'k':Math.round(v));
  const n = m.dp ? v.toFixed(m.dp) : Math.round(v).toLocaleString();
  return n + (m.unit||'');
}
function asdHash(s){ let h=2166136261; for(const ch of s){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; }

/* Lazily build (and cache) a customer's sub-measure detail. Seeded per account so it is stable across renders
   and never disturbs the main platform's RNG sequence. Sub-measures are tuned so their weighted average equals
   the source sub-score the health model already uses. */
function asdDetail(c){
  if(ASD_CACHE[c.id]) return ASD_CACHE[c.id];
  const r = mulberry32(asdHash(c.id+c.name));
  const rr = (a,b)=>a + r()*(b-a);
  const out = {};
  SOURCES.forEach(s=>{
    const S = c.sources[s.key];
    const defs = SUB_METRICS[s.key];
    const now = defs.map(m=> m.anchor ? asdScoreFromRaw(m, c, m.anchor(c)) : asdClamp(S + rr(-20,20), 3, 99));
    const pinned = defs.map(m=>!!m.anchor);
    for(let pass=0; pass<2; pass++){
      for(let it=0; it<8; it++){
        const tot = defs.reduce((a,m,i)=>a+now[i]*m.w,0)/100;
        const freeW = defs.reduce((a,m,i)=>a+(pinned[i]?0:m.w),0);
        if(!freeW || Math.abs(S-tot)<0.3) break;
        defs.forEach((m,i)=>{ if(!pinned[i]) now[i] = asdClamp(now[i] + (S-tot)*100/freeW, 3, 99); });
      }
      const tot = defs.reduce((a,m,i)=>a+now[i]*m.w,0)/100;
      if(Math.abs(S-tot)<1.5) break;
      pinned.fill(false); // live field can't be reconciled with the sub-score — let every sub-measure flex
    }
    const metrics = defs.map((m,i)=>{
      const slope = (c.trendDelta/6) * rr(0.2,1.8);
      const hist = new Array(12);
      hist[11] = now[i];
      for(let k=10;k>=0;k--) hist[k] = asdClamp(hist[k+1] - slope + rr(-4,4), 2, 100);
      return {def:m, scores:hist, raw:hist.map(sc=>asdRaw(m,c,sc))};
    });
    metrics.forEach((mt,i)=>{ if(pinned[i]) mt.raw[11] = mt.def.anchor(c); });
    let src = new Array(12).fill(0).map((_,k)=>metrics.reduce((a,mt)=>a+mt.scores[k]*mt.def.w,0)/100);
    const off = S - src[11];
    src = src.map(v=>asdClamp(v+off,2,100));
    out[s.key] = {metrics, history:src};
  });
  ASD_CACHE[c.id] = out;
  return out;
}
/* 12-month overall score: last 6 points are the platform's own score history, earlier months come from the sources. */
function asdOverallHistory(c, d){
  const w = WEIGHTS[scKey(c.lifecycle, c.segment)];
  const wsum = SOURCES.reduce((a,s)=>a+(w[s.key]||0),0) || 1;
  let calc = ASD_MONTHS.map((_,k)=>SOURCES.reduce((a,s)=>a+d[s.key].history[k]*(w[s.key]||0),0)/wsum);
  const hist = c.scoreHistory.map(p=>p.score).slice(-6);
  const pad = 12 - hist.length;
  const head = calc.slice(0, pad);
  const shift = (hist[0] ?? c.score) - (calc[pad] ?? calc[11]);
  const out = head.map(v=>asdClamp(Math.round(v+shift),2,100)).concat(hist);
  out[11] = c.score;
  return out;
}

/* ---------------------------- CHARTS ---------------------------- */
function asdLineChart(values, o){
  o = Object.assign({w:560, h:170, color:'var(--accent-deep)', min:null, max:null, bands:false, fmt:v=>Math.round(v), labels:ASD_MONTHS, area:true, id:'l'+Math.random().toString(36).slice(2,8)}, o||{});
  const padL=34, padR=12, padT=12, padB=24;
  const all = values.concat(o.lo||[], o.hi||[]);
  let lo = o.min!=null ? o.min : Math.min(...all), hi = o.max!=null ? o.max : Math.max(...all);
  if(o.min==null && o.max==null){ const pd=(hi-lo)*0.08 || Math.abs(hi)*0.1 || 1; lo = Math.max(Math.min(...all)>=0?0:-Infinity, lo-pd); hi = hi+pd; }
  const span = Math.max(1e-6, hi-lo);
  const X = i => padL + i*(o.w-padL-padR)/(values.length-1);
  const Y = v => padT + (1-(v-lo)/span)*(o.h-padT-padB);
  const pts = values.map((v,i)=>[X(i),Y(v)]);
  const path = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const ticks = [lo, lo+span/2, hi];
  let bands = '';
  if(o.bands && o.bandKey){
    const b = bandsFor(o.bandKey);
    bands = b.slice(0,3).map(x=> x.min>lo && x.min<hi ? `<line x1="${padL}" x2="${o.w-padR}" y1="${Y(x.min)}" y2="${Y(x.min)}" stroke="${x.color}" stroke-dasharray="3 4" stroke-width="1" opacity=".55"/><text x="${o.w-padR}" y="${Y(x.min)-3}" text-anchor="end" font-size="9.5" fill="${x.color}" font-family="IBM Plex Mono">${x.label} ${x.min}</text>` : '').join('');
  }
  return `<svg class="asd-chart" viewBox="0 0 ${o.w} ${o.h}" style="width:100%; height:auto; overflow:visible;">
    ${ticks.map(t=>`<line x1="${padL}" x2="${o.w-padR}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${padL-6}" y="${Y(t)+3.5}" text-anchor="end" font-size="10" fill="var(--ink-faint)" font-family="IBM Plex Mono">${o.fmt(t)}</text>`).join('')}
    ${bands}
    ${o.lo&&o.hi ? `<path d="${o.hi.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ')} ${o.lo.map((v,i)=>i).reverse().map(i=>'L'+X(i).toFixed(1)+' '+Y(o.lo[i]).toFixed(1)).join(' ')} Z" fill="${o.color}" opacity=".13"/>` : (o.area?`<path d="${path} L${X(values.length-1)} ${o.h-padB} L${padL} ${o.h-padB} Z" fill="${o.color}" opacity=".08"/>`:'')}
    <path d="${path}" fill="none" stroke="${o.color}" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round" />
    ${o.labels.map((l,i)=> i%2===1||i===o.labels.length-1 ? `<text x="${X(i)}" y="${o.h-6}" text-anchor="middle" font-size="10" fill="var(--ink-faint)" font-family="IBM Plex Mono">${l}</text>`:'').join('')}
    ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?4:2.2}" fill="${i===pts.length-1?o.color:'var(--surface)'}" stroke="${o.color}" stroke-width="1.5"><title>${o.labels[i]}: ${o.fmt(values[i])}</title></circle>`).join('')}
  </svg>`;
}
function asdSpark(values, color, w, h){

function asdGroupVal(c, g){ return g==='band' ? custBand(c).label : c[g]; }

function asdFiltered(){
  const f = state.asdFilters;
  const q = f.q.trim().toLowerCase();
  return CUSTOMERS.filter(c=>{
    if(f.stage && c.lifecycle!==f.stage) return false;

    if(f.csm && c.owner!==f.csm) return false;

    if(f.trend==='up' && c.trendDelta<=1) return false;
    if(f.trend==='down' && c.trendDelta>=-1) return false;
    if(f.trend==='flat' && Math.abs(c.trendDelta)>1) return false;
    if(f.arr==='lt50' && c.arr>=50000) return false;

    if(f.weak){ const weakest = SOURCES.reduce((a,s)=>c.sources[s.key]<c.sources[a.key]?s:a, SOURCES[0]); if(weakest.key!==f.weak) return false; }
    if(f.subSrc && f.subOp){
      const v = c.sources[f.subSrc];
      if(f.subOp==='lt40' && v>=40) return false;
      if(f.subOp==='lt60' && v>=60) return false;
      if(f.subOp==='gte80' && v<80) return false;
    }
    if(q){
      const hay = [c.name, c.owner, c.lifecycle, c.segment, custBand(c).label, fmtARR(c.arr), ...c.contacts.map(x=>x.name+' '+x.role)].join(' ').toLowerCase();
      if(!q.split(/\s+/).every(t=>hay.includes(t))) return false;
    }
    return true;
  }).sort((a,b)=>{
    const k = state.asdSort;
    if(k==='name') return a.name.localeCompare(b.name);
    if(k==='arr') return b.arr-a.arr;
    if(k==='renewal') return a.renewalInDays-b.renewalInDays;
    if(SOURCES.some(s=>s.key===k)) return a.sources[k]-b.sources[k];
    return a.score-b.score;
  });
}
function asdActiveChips(){
  const f = state.asdFilters, chips = [];
  if(f.q.trim()) chips.push({keys:['q'], text:`Search: “${f.q.trim()}”`});
  ASD_FILTER_DEFS.forEach(d=>{ if(f[d.k]){ const o = d.opts().find(x=>x[0]===f[d.k]); chips.push({keys:[d.k], text:`${d.label}: ${o?o[1]:f[d.k]}`}); } });
  if(f.subSrc && f.subOp) chips.push({keys:['subSrc','subOp'], text:`${SOURCES.find(s=>s.key===f.subSrc).name} ${ASD_SUBOPS.find(o=>o[0]===f.subOp)[1]}`});
  return chips;
}

/* ---------------------------- AGGREGATION ---------------------------- */
function asdMoney(v){ return v>=1e6 ? '$'+(v/1e6).toFixed(1)+'M' : fmtARR(v); }
function asdPct(arr, p){ if(!arr.length) return 0; const a=[...arr].sort((x,y)=>x-y); const i=(a.length-1)*p, lo=Math.floor(i), hi=Math.ceil(i); return a[lo]+(a[hi]-a[lo])*(i-lo); }
const asdAvg = arr => arr.length ? arr.reduce((a,v)=>a+v,0)/arr.length : 0;
function asdAggregate(list){
  const rows = list.map(c=>{ const d=asdDetail(c); return {c, d, h:asdOverallHistory(c,d), key:scKey(c.lifecycle,c.segment)}; });
  const M = ASD_MONTHS.map((_,k)=>k);
  const agg = {
    n:list.length,
    overall: M.map(k=>asdAvg(rows.map(r=>r.h[k]))),
    overallP25: M.map(k=>asdPct(rows.map(r=>r.h[k]),.25)),
    overallP75: M.map(k=>asdPct(rows.map(r=>r.h[k]),.75)),
    bandMix: M.map(k=>{ const m={thriving:0,stable:0,atrisk:0,critical:0}; rows.forEach(r=>m[bandFor(r.h[k], r.key).key]++); return m; }),
    sources:{}, rows,
  };
  SOURCES.forEach(s=>{
    const hs = rows.map(r=>r.d[s.key].history);
    const lost = asdAvg(rows.map(r=>{ const w=WEIGHTS[r.key]; const ws=SOURCES.reduce((a,x)=>a+(w[x.key]||0),0)||1; return (100-r.c.sources[s.key])*(w[s.key]||0)/ws; }));
    const gained = asdAvg(rows.map(r=>{ const w=WEIGHTS[r.key]; const ws=SOURCES.reduce((a,x)=>a+(w[x.key]||0),0)||1; return r.c.sources[s.key]*(w[s.key]||0)/ws; }));
    agg.sources[s.key] = {
      now: asdAvg(rows.map(r=>r.c.sources[s.key])),
      history: M.map(k=>asdAvg(hs.map(h=>h[k]))),
      p25: M.map(k=>asdPct(hs.map(h=>h[k]),.25)),
      p75: M.map(k=>asdPct(hs.map(h=>h[k]),.75)),
      lost, gained,
      weakestFor: rows.filter(r=>SOURCES.reduce((a,x)=>r.c.sources[x.key]<r.c.sources[a.key]?x:a, SOURCES[0]).key===s.key).length,
      below40: rows.filter(r=>r.c.sources[s.key]<40).length,
      metrics: SUB_METRICS[s.key].map((m,i)=>{
        const ms = rows.map(r=>r.d[s.key].metrics[i]);
        const per = rows.map((r,j)=>({c:r.c, raw:ms[j].raw[11], score:ms[j].scores[11], ch:ms[j].scores[11]-ms[j].scores[8]})).sort((a,b)=>a.score-b.score);
        return {
          def:m,
          raw: M.map(k=>asdAvg(ms.map(x=>x.raw[k]))),
          p25: M.map(k=>asdPct(ms.map(x=>x.raw[k]),.25)),
          p75: M.map(k=>asdPct(ms.map(x=>x.raw[k]),.75)),
          score: asdAvg(ms.map(x=>x.scores[11])),
          scoreCh: asdAvg(ms.map(x=>x.scores[11]-x.scores[8])),
          below40: per.filter(x=>x.score<40).length,
          declining: per.filter(x=>x.ch< -5).length,
          per,
        };
      }),
    };
  });
  return agg;
}

function asdExportCsv(){
  const list = asdFiltered();
  const head = ['Account','Stage','Segment','CSM','ARR','Health','Band','Trend (pts)','Renewal (days)', ...SOURCES.map(s=>s.name)];
  const esc = v => /[",\n]/.test(String(v)) ? '"'+String(v).replace(/"/g,'""')+'"' : v;
  const rows = list.map(c=>[c.name,c.lifecycle,c.segment,c.owner,c.arr,c.score,custBand(c).label,c.trendDelta,c.renewalInDays,...SOURCES.map(s=>c.sources[s.key])]);
  const csv = [head, ...rows].map(r=>r.map(esc).join(',')).join('\n');

  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));

/* Stacked monthly bars: how many accounts sat in each health band each month */
function asdBandBars(mix, n){
  const w=380, h=160, padL=26, padR=6, padT=10, padB=24;
  const bw = (w-padL-padR)/12;
  const order = ['critical','atrisk','stable','thriving'];
  const Y = v => padT + (1-v/Math.max(1,n))*(h-padT-padB);
  let bars = '';
  mix.forEach((m,i)=>{
    let acc = 0;
    order.forEach(k=>{
      if(!m[k]) return;
      const b = BANDS.find(x=>x.key===k);
      const y1 = Y(acc), y2 = Y(acc+m[k]);
      bars += `<rect x="${padL+i*bw+bw*0.18}" y="${y2}" width="${bw*0.64}" height="${Math.max(0,y1-y2-1)}" rx="2" fill="${b.color}"><title>${ASD_MONTHS[i]} · ${b.label}: ${m[k]} account${m[k]===1?'':'s'}</title></rect>`;
      acc += m[k];
    });
  });
  const ticks = [0, Math.round(n/2), n];
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto; overflow:visible;">
    ${ticks.map(t=>`<line x1="${padL}" x2="${w-padR}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text x="${padL-6}" y="${Y(t)+3.5}" text-anchor="end" font-size="10" fill="var(--ink-faint)" font-family="IBM Plex Mono">${t}</text>`).join('')}
    ${bars}
    ${ASD_MONTHS.map((l,i)=> i%2===1 ? `<text x="${padL+i*bw+bw/2}" y="${h-6}" text-anchor="middle" font-size="10" fill="var(--ink-faint)" font-family="IBM Plex Mono">${l}</text>`:'').join('')}
  </svg>`;
}

  }));
}

function asdPortfolioPanel(k, agg, list){
  const s = SOURCES.find(x=>x.key===k);
  const a = agg.sources[k];
  const v = Math.round(a.now), b = bandFor(v);
  const mixedSeg = new Set(list.map(c=>c.segment)).size > 1;
  return `<div class="card asd-panel">
    <div class="asd-panel-head">
      <div><h3>${s.name}</h3><p>${s.desc} · averaged across ${list.length} account${list.length===1?'':'s'}</p></div>
      <div class="asd-panel-stats">
        <div><span>Avg sub-score</span><b class="mono" style="color:${b.color}">${v}</b></div>
        <div><span>Points lost</span><b class="mono">${a.lost.toFixed(1)}</b></div>
        <div><span>Below 40</span><b class="mono" style="color:${a.below40?'var(--critical)':'inherit'}">${a.below40}</b></div>
        <div><span>Weakest source for</span><b class="mono">${a.weakestFor}</b></div>
      </div>
    </div>
    <div class="asd-chart-title">${s.name}: average sub-score, last 12 months <span>shaded = middle 50% of accounts</span></div>
    ${asdLineChart(a.history.map(x=>+x.toFixed(1)), {w:860, h:150, color:b.color, lo:a.p25, hi:a.p75})}
    <div class="asd-metric-grid">
      ${a.metrics.map(mt=>{
        const m = mt.def, goodUp = m.best > m.worst;
        const now = mt.raw[11], then = mt.raw[8];
        const msc = Math.round(mt.score), mb = bandFor(msc);
        const col = mt.scoreCh >= 0 ? 'var(--thriving)' : 'var(--critical)';
        const delta = m.money ? (now-then)/1000 : (m.dp ? +(now-then).toFixed(1) : Math.round(now-then));
        return `<div class="asd-metric">
          <div class="top"><span class="nm">${m.name}</span><span class="asd-heat" style="background:${mb.tint}; color:${mb.color};" title="Average sub-measure score (0–100)">${msc}</span></div>
          ${m.hint?`<div class="hint">${m.hint}</div>`:''}
          <div class="mid"><span class="v mono">${asdFmt(m, now)}</span>${asdDeltaChip(delta, goodUp)}<span class="asd-sub" style="margin:0;">avg${m.seg&&mixedSeg?' per account':''} · vs. Jun</span></div>
          ${asdLineChart(mt.raw, {w:250, h:96, color:col, lo:mt.p25, hi:mt.p75, fmt:x=>asdFmt(m,x).replace(m.unit||'@@','')})}
          <div class="asd-mstats mono"><span style="color:${mt.below40?'var(--critical)':'inherit'}">${mt.below40} below 40</span><span style="color:${mt.declining?'var(--atrisk)':'inherit'}">${mt.declining} declining</span></div>
          <div class="asd-low">
            <div class="lbl">Weakest accounts</div>
            ${mt.per.slice(0,3).map(x=>`<button data-asdlow="${x.c.id}" data-src="${k}"><span>${x.c.name}</span><b class="mono" style="color:${bandFor(x.score).color}">${asdFmt(m, x.raw)}</b></button>`).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

function renderAsdDetail(body, list){
  const c = CUSTOMERS.find(x=>x.id===state.asdCustomerId);
  if(!c){ state.asdCustomerId=null; return renderAsdPortfolio(body, list); }
  const key = scKey(c.lifecycle, c.segment);
  const w = WEIGHTS[key];
  const wsum = SOURCES.reduce((a,s)=>a+(w[s.key]||0),0) || 1;
  const d = asdDetail(c);
  const overall = asdOverallHistory(c, d);
  const band = custBand(c);
  const contrib = SOURCES.map(s=>({s, pts:c.sources[s.key]*(w[s.key]||0)/wsum, lost:(100-c.sources[s.key])*(w[s.key]||0)/wsum}));
  const drag = [...contrib].sort((a,b)=>b.lost-a.lost)[0];
  const strongest = SOURCES.reduce((a,s)=>c.sources[s.key]>c.sources[a.key]?s:a, SOURCES[0]);
  let worstMove = null;
  SOURCES.forEach(s=>d[s.key].metrics.forEach(mt=>{ const ch = mt.scores[11]-mt.scores[8]; if(!worstMove || ch<worstMove.ch) worstMove={s, mt, ch}; }));
  if(!state.asdSource) state.asdSource = drag.s.key;
  const idx = list.findIndex(x=>x.id===c.id);
  const COLORS = ['#6D28D9','#1F9D6B','#B78A1E','#C85A2B','#2563EB','#A32638','#0E7490'];

  body.innerHTML = `
    <div class="asd-layout">
      <aside class="card asd-list">
        <div class="asd-list-head mono">${list.length} matching</div>
        <div class="asd-list-items">
          ${list.map(x=>{ const b=custBand(x); return `<button class="asd-li ${x.id===c.id?'on':''}" data-asdpick="${x.id}"><span class="nm">${x.name}<span class="s">${x.lifecycle} · ${x.segment} · ${x.owner}</span></span><span class="score-badge" style="background:${b.tint}; color:${b.color}; width:32px; height:22px; font-size:11.5px;">${x.score}</span></button>`; }).join('') || `<div style="padding:16px; font-size:12px; color:var(--ink-faint);">No accounts match these filters.</div>`}
        </div>
      </aside>
      <div class="asd-main">
        <div class="card asd-hero">
          <div class="asd-hero-id">
            <div style="display:flex; gap:12px; align-items:center;">
              <div class="avatar" style="width:42px; height:42px; font-size:15px;">${c.initials}</div>
              <div>
                <h3 style="font-size:18px;">${c.name}</h3>
                <div style="display:flex; gap:6px; margin-top:5px; flex-wrap:wrap;"><span class="pill pill-neutral">${c.lifecycle}</span><span class="pill pill-neutral">${c.segment}</span><span class="pill pill-${band.key}"><span class="pill-dot"></span>${band.label}</span></div>
              </div>
            </div>
            <div class="asd-facts">
              <div><span>CSM</span><b>${c.owner}</b></div>
              <div><span>ARR</span><b class="mono">${fmtARR(c.arr)}</b></div>
              <div><span>Renewal in</span><b class="mono">${c.renewalInDays}d</b></div>
              <div><span>Predictive risk</span><b class="mono" style="color:${c.predictiveRisk<50?'var(--critical)':c.predictiveRisk<70?'var(--atrisk)':'var(--thriving)'}">${c.predictiveRisk}</b></div>
            </div>
            <div style="display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;">
              <button class="btn btn-sm" id="asdPrev" ${idx<=0?'disabled':''}>← Prev</button>
              <button class="btn btn-sm" id="asdNext" ${idx<0||idx>=list.length-1?'disabled':''}>Next →</button>
              <button class="btn btn-sm" id="asdOpenDrawer">${ICON.eye}Account details</button>
            </div>
          </div>
          <div class="asd-hero-gauge">${gaugeSvg(c.score, key)}<div class="mono" style="font-size:11px; color:var(--ink-faint); text-align:center; margin-top:4px;">${c.lifecycle} · ${c.segment} scorecard</div></div>
          <div class="asd-hero-chart">
            <div class="asd-chart-title">Overall health — last 12 months <span>${asdDeltaChip(overall[11]-overall[0], true)} vs. Oct</span></div>
            ${asdLineChart(overall, {w:380, h:160, color:band.color, min:0, max:100, bands:true, bandKey:key})}
          </div>
        </div>

        <div class="section-title">${ICON.merge}How the ${c.score} is built <span class="asd-sub">sub-score × scorecard weight = points contributed</span></div>
        <div class="card" style="padding:16px 18px;">
          <div class="asd-stack">
            ${contrib.map((x,i)=>`<span style="width:${x.pts}%; background:${COLORS[i]};" title="${x.s.name}: ${x.pts.toFixed(1)} pts"></span>`).join('')}
            <span class="gap" style="flex:1;" title="Points lost: ${(100-c.score)}"></span>
          </div>
          <div class="asd-legend">
            ${contrib.map((x,i)=>`<div><i style="background:${COLORS[i]}"></i>${x.s.name}<b class="mono">${x.pts.toFixed(1)}</b><span class="mono">of ${(w[x.s.key]*100/wsum).toFixed(0)}</span></div>`).join('')}
          </div>
        </div>

        <div class="card asd-insight">
          <span style="flex-shrink:0; margin-top:1px; color:var(--accent-deep);">${svg('sparkle')}</span>
          <p><b>What's moving this score.</b> The biggest drag is <b>${drag.s.name}</b> (${c.sources[drag.s.key]}), costing ${drag.lost.toFixed(1)} points at its ${w[drag.s.key]}% weight.
          ${worstMove && worstMove.ch< -2 ? ` The sharpest recent decline is <b>${worstMove.mt.def.name}</b> in ${worstMove.s.name}, now ${asdFmt(worstMove.mt.def, worstMove.mt.raw[11])} (down ${Math.abs(Math.round(worstMove.ch))} score points in 3 months).` : ' No sub-measure has dropped meaningfully in the last 3 months.'}
          Strongest source: <b>${strongest.name}</b> (${c.sources[strongest.key]}).</p>
        </div>

        <div class="section-title">${ICON.gauge}Data source sub-scores <span class="asd-sub">select one to see its sub-measures</span>
          <button class="btn btn-sm" id="asdAll" style="margin-left:auto;">${state.asdShowAll?'Show one source':'Show all sub-measures'}</button></div>
        <div class="asd-src-grid">
          ${SOURCES.map(s=>{ const v=c.sources[s.key]; const b=bandFor(v); const h=d[s.key].history; const ch=h[11]-h[8];
            return `<button class="card asd-src ${state.asdSource===s.key&&!state.asdShowAll?'on':''}" data-asdsrc="${s.key}">
              <div class="top"><span class="nm">${s.name}</span><span class="wt mono">wt ${w[s.key]}%</span></div>
              <div class="mid"><span class="v mono" style="color:${b.color}">${v}</span>${asdDeltaChip(ch,true)}<span class="asd-sub" style="margin:0;">3 mo</span></div>
              ${asdSpark(h, b.color, 150, 30)}
            </button>`; }).join('')}
        </div>
        <div id="asdSrcPanels"></div>
      </div>
    </div>`;

  const panels = document.getElementById('asdSrcPanels');
  const keys = state.asdShowAll ? SOURCES.map(s=>s.key) : [state.asdSource];
  panels.innerHTML = keys.map(k=>asdSourcePanel(c, k, d, w)).join('');

  body.querySelectorAll('[data-asdpick]').forEach(b=>b.addEventListener('click', ()=>{ state.asdCustomerId=b.dataset.asdpick; state.asdSource=null; renderAsdBody(); document.getElementById('main').scrollTop=0; }));
  body.querySelectorAll('[data-asdsrc]').forEach(b=>b.addEventListener('click', ()=>{ state.asdSource=b.dataset.asdsrc; state.asdShowAll=false; renderAsdBody(); const p=document.getElementById('asdSrcPanels'); if(p) p.scrollIntoView({behavior:'smooth', block:'start'}); }));
  document.getElementById('asdAll').addEventListener('click', ()=>{ state.asdShowAll=!state.asdShowAll; renderAsdBody(); });
  document.getElementById('asdPrev').addEventListener('click', ()=>{ if(idx>0){ state.asdCustomerId=list[idx-1].id; state.asdSource=null; renderAsdBody(); } });
  document.getElementById('asdNext').addEventListener('click', ()=>{ if(idx<list.length-1){ state.asdCustomerId=list[idx+1].id; state.asdSource=null; renderAsdBody(); } });
  document.getElementById('asdOpenDrawer').addEventListener('click', ()=>openCustomerDrawer(c.id));
  const on = body.querySelector('.asd-li.on'); if(on) on.scrollIntoView({block:'nearest'});
}

function asdSourcePanel(c, k, d, w){
  const s = SOURCES.find(x=>x.key===k);
  const v = c.sources[k]; const b = bandFor(v);
  const src = d[k];
  const peers = CUSTOMERS.filter(x=>x.lifecycle===c.lifecycle && x.segment===c.segment);
  const peerAvg = Math.round(peers.reduce((a,x)=>a+x.sources[k],0)/peers.length);
  return `<div class="card asd-panel">
    <div class="asd-panel-head">
      <div>
        <h3>${s.name}</h3>
        <p>${s.desc}</p>
      </div>
      <div class="asd-panel-stats">
        <div><span>Sub-score</span><b class="mono" style="color:${b.color}">${v}</b></div>
        <div><span>Weight</span><b class="mono">${w[k]}%</b></div>
        <div><span>Peer avg</span><b class="mono">${peerAvg}</b></div>
      </div>
    </div>
    <div class="asd-chart-title">${s.name} sub-score — last 12 months</div>
    ${asdLineChart(src.history.map(Math.round), {w:860, h:150, color:b.color, min:0, max:100})}
    <div class="asd-metric-grid">
      ${src.metrics.map(mt=>{
        const m = mt.def; const now = mt.raw[11], then = mt.raw[8];
        const goodUp = m.best > m.worst;
        const msc = Math.round(mt.scores[11]); const mb = bandFor(msc);
        const lo = Math.min(m.worst, m.best)*(m.seg?ASD_SEG_SCALE[c.segment]:1), hi = Math.max(m.worst, m.best)*(m.seg?ASD_SEG_SCALE[c.segment]:1);
        const col = mt.scores[11]>=mt.scores[0] ? 'var(--thriving)' : 'var(--critical)';
        return `<div class="asd-metric">
          <div class="top"><span class="nm">${m.name}</span><span class="asd-heat" style="background:${mb.tint}; color:${mb.color};" title="Sub-measure score (0–100)">${msc}</span></div>
          ${m.hint?`<div class="hint">${m.hint}</div>`:''}
          <div class="mid"><span class="v mono">${asdFmt(m, now)}</span>${asdDeltaChip(m.money? (now-then)/1000 : (m.dp? +(now-then).toFixed(1) : Math.round(now-then)), goodUp)}<span class="asd-sub" style="margin:0;">vs. Jun</span></div>
          ${asdLineChart(mt.raw, {w:250, h:96, color:col, min:lo, max:hi, fmt:x=>asdFmt(m,x).replace(m.unit||'@@',''), area:true, labels:ASD_MONTHS})}
          <div class="foot mono"><span>${goodUp?'Higher':'Lower'} is better</span><span>${m.w}% of source</span></div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

/* ---------------------------- INIT ---------------------------- */
function init(){
  document.addEventListener('click', e=>{
    const t = e.target.closest('[data-asd]');
    if(!t) return;
    e.stopPropagation(); e.preventDefault();
    openAdvancedScore(t.dataset.asd);
  }, true);
  renderShell();
  const gs = document.getElementById('globalSearch');
  if(gs) gs.addEventListener('keydown', e=>{ if(e.key==='Enter'){ state.asdFilters.q = gs.value; state.asdCustomerId = null; setView('scoredash'); } });
  setView('dashboard');
}
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
