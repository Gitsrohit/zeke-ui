<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zeke AI — Digital Customer Success Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================= TOKENS ============================= */
:root{
  --bg:#F5F6F8;
  --surface:#FFFFFF;
  --surface-2:#FAFBFC;
  --ink:#131A2B;
  --ink-soft:#4B5568;
  --ink-faint:#8993A6;
  --line:#E2E5EB;
  --line-strong:#CBD1DC;
  --purple:#6D3FC4;
  --purple-deep:#1E1033;
  --purple-tint:#F2EEFC;
  --accent:#8B5CF6;
  --accent-deep:#6D28D9;
  --accent-tint:#F5F0FE;
  --thriving:#1F9D6B;
  --thriving-tint:#E6F6EE;
  --stable:#B78A1E;
  --stable-tint:#FBF2DD;
  --atrisk:#C85A2B;
  --atrisk-tint:#FCE9DE;
  --critical:#A32638;
  --critical-tint:#FAE3E6;
  --radius-sm:4px;
  --radius-md:8px;
  --shadow-pop: 0 12px 32px -12px rgba(30,16,51,0.24);
  --font-display:'Space Grotesk', sans-serif;
  --font-ui:'IBM Plex Sans', sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font-ui); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;}
a{color:inherit;}
h1,h2,h3,h4{font-family:var(--font-display); margin:0; letter-spacing:-0.01em;}
.mono{font-family:var(--font-mono);}
::selection{background:var(--accent-tint); color:var(--purple-deep);}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
svg{display:block;}

/* ============================= APP SHELL ============================= */
#app{display:grid; grid-template-columns:232px 1fr; grid-template-rows:60px 1fr; height:100vh; min-height:640px;}

/* ---- Sidebar ---- */
.rail{
  grid-row:1/3; grid-column:1;
  background:var(--purple-deep); color:#DCE6F2;
  display:flex; flex-direction:column;
  border-right:1px solid #0F1F35;
}
.rail-brand{
  display:flex; align-items:center; gap:10px;
  padding:18px 20px 16px; border-bottom:1px solid rgba(255,255,255,0.08);
}
.rail-brand .mark{
  width:32px; height:32px; border-radius:8px;
  background:linear-gradient(135deg, var(--accent), #7C3AED 55%, #C026D3);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
  font-family:var(--font-display); font-weight:700; font-size:16px; letter-spacing:-.02em; color:#fff;
  box-shadow:0 3px 10px -2px rgba(124,58,237,0.55);
}
.rail-brand .name{font-family:var(--font-display); font-weight:700; font-size:17px; color:#fff;}
.rail-brand .tag{font-size:10.5px; color:#8FA3BC; letter-spacing:.03em; margin-top:1px;}

.rail-nav{flex:1; padding:14px 10px; display:flex; flex-direction:column; gap:2px; overflow-y:auto;}
.rail-link{
  display:flex; align-items:center; gap:11px;
  padding:9px 12px; border-radius:7px; color:#B7C6DB;
  cursor:pointer; font-size:13.5px; font-weight:500; border:none; background:none; text-align:left; width:100%;
  transition:background .12s, color .12s;
}
.rail-link svg{width:17px; height:17px; stroke:currentColor; flex-shrink:0;}
.rail-link:hover{background:rgba(255,255,255,0.06); color:#fff;}
.rail-link.active{background:var(--accent); color:#062525; font-weight:600;}
.nav-badge{
  margin-left:auto; background:rgba(255,255,255,0.14); color:#fff; font-family:var(--font-mono); font-size:10.5px; font-weight:700;
  min-width:18px; height:18px; border-radius:100px; display:none; align-items:center; justify-content:center; padding:0 5px;
}
.rail-link.active .nav-badge{background:rgba(6,37,37,0.25); color:#062525;}
.nav-badge-alert{background:var(--critical);}
.rail-link.active .nav-badge-alert{background:var(--critical);}
.rail-foot{padding:14px 18px; border-top:1px solid rgba(255,255,255,0.08); font-size:11.5px; color:#7E93AE;}
.rail-foot b{color:#C3D4E8;}

/* ---- Topbar ---- */
.topbar{
  grid-row:1; grid-column:2;
  background:var(--surface); border-bottom:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 24px; gap:18px;
}
.topbar-title{display:flex; flex-direction:column; justify-content:center;}
.topbar-title .crumb{font-size:11px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.06em; font-family:var(--font-mono);}
.topbar-title h2{font-size:18px;}
.topbar-right{display:flex; align-items:center; gap:10px;}
.search-box{
  display:flex; align-items:center; gap:8px; background:var(--surface-2);
  border:1px solid var(--line); border-radius:7px; padding:7px 12px; width:230px;
  color:var(--ink-faint);
}
.search-box svg{width:15px; height:15px; stroke:currentColor; flex-shrink:0;}
.search-box input{border:none; background:none; outline:none; font-size:13px; width:100%; font-family:inherit; color:var(--ink);}
.icon-btn{
  width:34px; height:34px; border-radius:7px; border:1px solid var(--line); background:var(--surface);
  display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft);
}
.icon-btn svg{width:16px; height:16px; stroke:currentColor;}
.icon-btn:hover{background:var(--surface-2); color:var(--ink);}
.ask-zeke-btn{
  display:flex; align-items:center; gap:7px; background:var(--purple); color:#fff; border:none;
  border-radius:7px; padding:8px 14px; font-size:13px; font-weight:600; cursor:pointer;
}
.ask-zeke-btn svg{width:15px; height:15px; stroke:currentColor;}
.ask-zeke-btn:hover{background:var(--purple-deep);}

/* ---- Main ---- */
.main{grid-row:2; grid-column:2; overflow-y:auto; padding:26px 30px 60px;}
.view{display:none;}
.view.active{display:block; animation:fadein .18s ease;}
@keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

.view-head{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:20px; gap:20px; flex-wrap:wrap;}
.view-head h1{font-size:23px;}
.view-head p{margin:4px 0 0; color:var(--ink-soft); font-size:13.5px; max-width:560px;}
.view-actions{display:flex; gap:10px;}

/* ============================= COMPONENTS ============================= */
.btn{
  border-radius:7px; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink);
  padding:8px 14px; font-size:13px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:7px;
  font-family:inherit;
}
.btn svg{width:14px; height:14px; stroke:currentColor;}
.btn:hover{background:var(--surface-2); border-color:var(--ink-faint);}
.btn-primary{background:var(--purple); color:#fff; border-color:var(--purple);}
.btn-primary:hover{background:var(--purple-deep); border-color:var(--purple-deep);}
.btn-accent{background:var(--accent); color:#fff; border-color:var(--accent);}
.btn-accent:hover{background:var(--accent-deep); border-color:var(--accent-deep);}
.btn-ghost{border-color:transparent; background:none;}
.btn-ghost:hover{background:var(--surface-2);}
.btn-sm{padding:5px 10px; font-size:12px;}
.btn:disabled{opacity:.45; cursor:not-allowed;}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md);}
.pill{
  display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:100px;
  font-size:11px; font-weight:600; font-family:var(--font-mono); letter-spacing:.01em;
}
.pill-dot{width:6px; height:6px; border-radius:50%; background:currentColor;}
.pill-thriving{background:var(--thriving-tint); color:var(--thriving);}
.pill-stable{background:var(--stable-tint); color:var(--stable);}
.pill-atrisk{background:var(--atrisk-tint); color:var(--atrisk);}
.pill-critical{background:var(--critical-tint); color:var(--critical);}
.pill-neutral{background:var(--purple-tint); color:var(--purple);}

.kpi-row{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px;}
.kpi{padding:16px 18px; border-radius:var(--radius-md); border:1px solid var(--line); background:var(--surface); position:relative; overflow:hidden;}
.kpi .label{font-size:11.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em; font-family:var(--font-mono);}
.kpi .value{font-family:var(--font-display); font-size:28px; font-weight:700; margin-top:6px;}
.kpi .delta{font-size:12px; margin-top:4px; display:flex; align-items:center; gap:4px; color:var(--ink-soft);}
.kpi .delta.up{color:var(--thriving);}
.kpi .delta.down{color:var(--critical);}
.kpi .delta svg{width:12px; height:12px; stroke:currentColor;}

table{width:100%; border-collapse:collapse; font-size:13px;}
thead th{
  text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint);
  font-family:var(--font-mono); font-weight:600; padding:0 12px 10px; border-bottom:1px solid var(--line);
  white-space:nowrap;
}
tbody td{padding:12px; border-bottom:1px solid var(--line); vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr.clickable{cursor:pointer;}
tbody tr.clickable:hover{background:var(--surface-2);}

.score-badge{
  display:inline-flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-weight:700;
  font-size:13px; width:38px; height:26px; border-radius:6px;
}
.avatar{
  width:30px; height:30px; border-radius:7px; background:var(--purple-tint); color:var(--purple);
  display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:12.5px; flex-shrink:0;
}
.cust-name{display:flex; align-items:center; gap:10px;}
.cust-name .meta{display:flex; flex-direction:column;}
.cust-name .meta .n{font-weight:600; color:var(--ink);}
.cust-name .meta .s{font-size:11.5px; color:var(--ink-faint);}

.trend{display:inline-flex; align-items:center; gap:3px; font-family:var(--font-mono); font-size:12px;}
.trend svg{width:12px; height:12px; stroke:currentColor;}
.trend.up{color:var(--thriving);}
.trend.down{color:var(--critical);}
.trend.flat{color:var(--ink-faint);}

.tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:20px;}
.tab-btn{
  padding:9px 4px; margin-right:20px; background:none; border:none; border-bottom:2px solid transparent;
  font-size:13.5px; font-weight:600; color:var(--ink-faint); cursor:pointer; font-family:inherit;
}
.tab-btn.active{color:var(--purple); border-bottom-color:var(--accent);}

/* ---- Scorecard matrix ---- */
.matrix-wrap{display:grid; grid-template-columns:110px repeat(3,1fr); gap:10px;}
.matrix-head{font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); font-family:var(--font-mono); padding:8px 4px; align-self:end;}
.matrix-row-label{
  display:flex; align-items:center; font-family:var(--font-display); font-weight:600; font-size:13.5px; color:var(--purple);
  writing-mode:horizontal-tb; padding:4px 2px;
}
.sc-card{
  border:1px solid var(--line); border-radius:var(--radius-md); background:var(--surface); padding:14px 16px; cursor:pointer;
  transition:box-shadow .12s, border-color .12s;
}
.sc-card:hover{box-shadow:var(--shadow-pop); border-color:var(--line-strong);}
.sc-card .top{display:flex; justify-content:space-between; align-items:flex-start;}
.sc-card .seg{font-size:11px; color:var(--ink-faint); font-family:var(--font-mono);}
.sc-card .avg{font-family:var(--font-display); font-size:26px; font-weight:700; margin-top:8px;}
.sc-card .count{font-size:12px; color:var(--ink-soft); margin-top:2px;}
.dist-bar{display:flex; height:6px; border-radius:4px; overflow:hidden; margin-top:12px; background:var(--line);}
.dist-bar span{height:100%;}

.weight-row{display:grid; grid-template-columns:170px 1fr 46px; align-items:center; gap:14px; padding:9px 0;}
.weight-row .src-name{font-size:13px; font-weight:500;}
.weight-row .src-sub{font-size:11px; color:var(--ink-faint); margin-top:1px;}
input[type=range]{-webkit-appearance:none; width:100%; height:4px; background:var(--line); border-radius:4px; outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:15px; height:15px; border-radius:50%; background:var(--accent); cursor:pointer; border:2px solid #fff; box-shadow:0 0 0 1px var(--accent);}
input[type=range]::-moz-range-thumb{width:15px; height:15px; border-radius:50%; background:var(--accent); cursor:pointer; border:2px solid #fff; box-shadow:0 0 0 1px var(--accent);}
.weight-val{font-family:var(--font-mono); font-weight:600; text-align:right; font-size:13px;}
.weight-total{display:flex; justify-content:space-between; align-items:center; padding-top:12px; margin-top:8px; border-top:1px dashed var(--line-strong); font-family:var(--font-mono); font-size:13px;}
.weight-total.bad{color:var(--critical);}
.weight-total.good{color:var(--thriving);}

/* ---- Gauge ---- */
.gauge{position:relative; width:120px; height:120px;}
.gauge svg{width:120px; height:120px; transform:rotate(-90deg);}
.gauge-label{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
.gauge-label .n{font-family:var(--font-display); font-size:30px; font-weight:700; line-height:1;}
.gauge-label .l{font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.04em; margin-top:2px;}

/* ---- Drawer ---- */
.overlay{position:fixed; inset:0; background:rgba(19,26,43,0.42); z-index:40; display:none;}
.overlay.show{display:block;}
.drawer{
  position:fixed; top:0; right:0; bottom:0; width:520px; max-width:92vw; background:var(--surface);
  z-index:41; box-shadow:-16px 0 40px rgba(19,26,43,.18); transform:translateX(100%); transition:transform .22s ease;
  display:flex; flex-direction:column;
}
.drawer.show{transform:translateX(0);}
.drawer-head{padding:18px 22px; border-bottom:1px solid var(--line); display:flex; align-items:flex-start; justify-content:space-between; gap:12px;}
.drawer-body{padding:20px 22px; overflow-y:auto; flex:1;}
.drawer-close{background:none; border:none; cursor:pointer; color:var(--ink-faint); padding:4px;}
.drawer-close svg{width:18px; height:18px; stroke:currentColor;}
.drawer-tabs{display:flex; gap:2px; padding:0 22px; border-bottom:1px solid var(--line); flex-shrink:0;}
.drawer-tabs .tab-btn{padding:10px 4px; margin-right:18px; font-size:12.5px;}
.sparkline{display:block;}

.modal-overlay{position:fixed; inset:0; background:rgba(19,26,43,0.42); z-index:50; display:none; align-items:center; justify-content:center;}
.modal-overlay.show{display:flex;}
.modal{background:var(--surface); border-radius:var(--radius-md); width:440px; max-width:92vw; box-shadow:var(--shadow-pop); padding:22px;}
.modal h3{font-size:16px; margin-bottom:14px;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:5px;}
.field input,.field select,.field textarea{
  width:100%; padding:8px 10px; border:1px solid var(--line-strong); border-radius:6px; font-family:inherit; font-size:13px; background:var(--surface); color:var(--ink);
}
.field textarea{resize:vertical; min-height:70px;}

/* ---- Audience ---- */
.filter-row{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
.filter-row select,.filter-row input{padding:7px 9px; border:1px solid var(--line-strong); border-radius:6px; font-size:12.5px; font-family:inherit; background:var(--surface);}
.filter-row .fld{width:190px;}
.filter-row .op{width:120px;}
.filter-row .val{flex:1;}
.filter-row .rm{background:none; border:none; color:var(--ink-faint); cursor:pointer; padding:4px;}
.filter-row .rm svg{width:15px; height:15px; stroke:currentColor;}
.filter-row .rm:hover{color:var(--critical);}
.aud-group{border:1px solid var(--line-strong); border-radius:8px; padding:12px 14px; background:var(--surface-2); margin-bottom:2px;}
.aud-group-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
.aud-group-head .rm{background:none; border:none; color:var(--ink-faint); cursor:pointer; padding:2px;}
.aud-group-head .rm svg{width:14px; height:14px; stroke:currentColor;}
.aud-group-head .rm:hover{color:var(--critical);}
.or-divider{display:flex; align-items:center; gap:10px; margin:10px 0; color:var(--ink-faint);}
.or-divider:before,.or-divider:after{content:''; flex:1; height:1px; background:var(--line-strong);}
.or-divider span{font-family:var(--font-mono); font-size:11px; font-weight:700; letter-spacing:.04em; background:var(--purple-tint); color:var(--purple); padding:2px 10px; border-radius:100px;}

.chat-panel{display:flex; flex-direction:column; height:460px; border:1px solid var(--line); border-radius:var(--radius-md); overflow:hidden; background:var(--surface);}
.chat-log{flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:14px;}
.chat-msg{max-width:82%; padding:10px 13px; border-radius:10px; font-size:13.5px; line-height:1.5;}
.chat-msg.bot{background:var(--surface-2); border:1px solid var(--line); align-self:flex-start; border-bottom-left-radius:2px;}
.chat-msg.user{background:var(--purple); color:#fff; align-self:flex-end; border-bottom-right-radius:2px;}
.chat-msg .filters-echo{display:flex; flex-wrap:wrap; gap:6px; margin-top:9px;}
.chip{background:var(--accent-tint); color:var(--accent-deep); font-family:var(--font-mono); font-size:11px; padding:3px 9px; border-radius:100px; font-weight:600;}
.chat-suggest{display:flex; flex-wrap:wrap; gap:7px; padding:0 18px 12px;}
.suggest-chip{background:var(--surface-2); border:1px solid var(--line); border-radius:100px; padding:6px 12px; font-size:12px; cursor:pointer; color:var(--ink-soft);}
.suggest-chip:hover{border-color:var(--accent); color:var(--accent-deep);}
.chat-input-row{display:flex; gap:8px; padding:12px; border-top:1px solid var(--line); background:var(--surface-2);}
.chat-input-row input{flex:1; border:1px solid var(--line-strong); border-radius:7px; padding:9px 12px; font-family:inherit; font-size:13px;}
.chat-send{background:var(--accent); border:none; color:#fff; width:38px; border-radius:7px; cursor:pointer; display:flex; align-items:center; justify-content:center;}
.chat-send svg{width:16px; height:16px; stroke:currentColor;}

/* ---- Agents ---- */
.pb-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:14px;}
.pb-card{padding:16px 17px; border:1px solid var(--line); border-radius:var(--radius-md); background:var(--surface); cursor:pointer; display:flex; flex-direction:column; gap:10px;}
.pb-card:hover{box-shadow:var(--shadow-pop); border-color:var(--line-strong);}
.pb-card .cat{align-self:flex-start;}
.pb-card h4{font-size:14.5px;}
.pb-card p{font-size:12.5px; color:var(--ink-soft); margin:0; flex:1;}
.pb-card .foot{display:flex; justify-content:space-between; align-items:center; font-size:11.5px; color:var(--ink-faint); font-family:var(--font-mono); border-top:1px solid var(--line); padding-top:10px;}

.flow-wrap{display:grid; grid-template-columns:1fr 320px; gap:22px; align-items:start;}
.flow-col{display:flex; flex-direction:column; align-items:stretch; gap:0; max-width:480px;}
.flow-node{
  border:1px solid var(--line-strong); border-radius:8px; background:var(--surface); padding:12px 14px; display:flex; gap:11px; align-items:flex-start; cursor:pointer; position:relative;
}
.flow-node.selected{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-tint);}
.flow-node .ic{width:30px; height:30px; border-radius:7px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.flow-node .ic svg{width:15px; height:15px; stroke:currentColor;}
.flow-node .body{flex:1; min-width:0;}
.flow-node .ttl{font-size:12.5px; font-weight:600;}
.flow-node .sub{font-size:11.5px; color:var(--ink-faint); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.flow-node .del{background:none; border:none; color:var(--ink-faint); cursor:pointer; padding:3px;}
.flow-node .del svg{width:14px; height:14px; stroke:currentColor;}
.flow-node .del:hover{color:var(--critical);}
.flow-connector{width:2px; height:22px; background:var(--line-strong); margin-left:29px; position:relative;}
.flow-add{
  display:flex; align-items:center; gap:8px; margin:2px 0 2px 15px; cursor:pointer; color:var(--ink-faint);
}
.flow-add .plus{width:28px; height:28px; border-radius:50%; border:1.5px dashed var(--line-strong); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.flow-add .plus svg{width:13px; height:13px; stroke:currentColor;}
.flow-add:hover{color:var(--accent-deep);}
.flow-add:hover .plus{border-color:var(--accent); border-style:solid; background:var(--accent-tint); color:var(--accent-deep);}
.flow-add .lbl{font-size:12px; font-weight:600;}

.branch-wrap{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin:6px 0 6px 15px; padding:12px; background:var(--surface-2); border-radius:8px; border:1px solid var(--line);}
.branch-col .branch-tag{font-size:10.5px; font-family:var(--font-mono); font-weight:700; text-transform:uppercase; letter-spacing:.04em; margin-bottom:8px; display:inline-block; padding:2px 8px; border-radius:4px;}
.branch-tag.yes{background:var(--thriving-tint); color:var(--thriving);}
.branch-tag.no{background:var(--critical-tint); color:var(--critical);}

.node-type-menu{position:absolute; z-index:20; background:var(--surface); border:1px solid var(--line); border-radius:8px; box-shadow:var(--shadow-pop); padding:6px; display:none; min-width:190px;}
.node-type-menu.show{display:block;}
.node-type-menu button{
  display:flex; align-items:center; gap:10px; width:100%; padding:8px 10px; background:none; border:none; text-align:left;
  border-radius:6px; cursor:pointer; font-size:12.5px; font-family:inherit; color:var(--ink);
}
.node-type-menu button:hover{background:var(--surface-2);}
.node-type-menu button .ic{width:24px; height:24px; border-radius:6px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.node-type-menu button .ic svg{width:13px; height:13px; stroke:currentColor;}

.config-panel{border:1px solid var(--line); border-radius:var(--radius-md); background:var(--surface); padding:18px; position:sticky; top:0;}
.config-panel h4{font-size:13.5px; margin-bottom:14px; display:flex; align-items:center; gap:8px;}
.config-empty{color:var(--ink-faint); font-size:13px; text-align:center; padding:40px 10px;}

.trigger-node{background:var(--purple-tint); border:1px solid #DDD0F7; border-radius:8px; padding:12px 14px; display:flex; align-items:center; gap:11px; margin-bottom:0;}
.trigger-node .ic{width:30px; height:30px; border-radius:7px; background:var(--purple); color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.trigger-node .ic svg{width:15px; height:15px; stroke:currentColor;}
.trigger-node .ttl{font-size:12.5px; font-weight:700; color:var(--purple);}
.trigger-node .sub{font-size:11.5px; color:#5C4B7E; margin-top:1px;}

/* ---- Admin ---- */
.int-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px;}
.int-card{border:1px solid var(--line); border-radius:var(--radius-md); background:var(--surface); padding:15px 16px; display:flex; flex-direction:column; gap:10px;}
.int-card .row1{display:flex; justify-content:space-between; align-items:flex-start;}
.int-logo{width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center; background:var(--purple-tint); color:var(--purple); font-family:var(--font-display); font-weight:700; font-size:13px;}
.switch{position:relative; width:36px; height:20px; flex-shrink:0;}
.switch input{opacity:0; width:0; height:0;}
.switch .track{position:absolute; inset:0; background:var(--line-strong); border-radius:100px; cursor:pointer; transition:background .15s;}
.switch .track:before{content:''; position:absolute; width:14px; height:14px; left:3px; top:3px; background:#fff; border-radius:50%; transition:transform .15s;}
.switch input:checked + .track{background:var(--thriving);}
.switch input:checked + .track:before{transform:translateX(16px);}
.int-card .name{font-weight:600; font-size:13.5px;}
.int-card .desc{font-size:11.5px; color:var(--ink-faint);}
.int-card .status{font-size:11px; font-family:var(--font-mono); font-weight:600;}
.int-card .status.on{color:var(--thriving);}
.int-card .status.off{color:var(--ink-faint);}

.section-title{font-size:14.5px; margin:30px 0 12px; display:flex; align-items:center; gap:8px;}
.section-title svg{width:16px; height:16px; stroke:var(--purple);}

.toast-wrap{position:fixed; bottom:24px; right:24px; z-index:60; display:flex; flex-direction:column; gap:8px;}
.toast{
  background:var(--purple-deep); color:#fff; padding:12px 16px; border-radius:8px; font-size:13px; display:flex; align-items:center; gap:10px;
  box-shadow:var(--shadow-pop); animation:toastin .2s ease;
}
.toast svg{width:16px; height:16px; stroke:var(--accent); flex-shrink:0;}
@keyframes toastin{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}

.empty-state{text-align:center; padding:50px 20px; color:var(--ink-faint);}
.empty-state svg{width:34px; height:34px; stroke:var(--ink-faint); margin:0 auto 12px;}
.empty-state h4{color:var(--ink-soft); font-size:14px; margin-bottom:4px;}
.empty-state p{font-size:12.5px; max-width:280px; margin:0 auto;}

.source-bar{display:flex; flex-direction:column; gap:10px;}
.source-bar-row .head{display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px;}
.source-bar-row .head .nm{font-weight:600;}
.source-bar-row .head .sc{font-family:var(--font-mono); color:var(--ink-soft);}
.source-bar-row .track{height:6px; background:var(--line); border-radius:4px; overflow:hidden;}
.source-bar-row .track > div{height:100%; background:var(--accent);}

.timeline{display:flex; flex-direction:column;}
.tl-item{display:flex; gap:12px; padding-bottom:18px; position:relative;}
.tl-item:before{content:''; position:absolute; left:13px; top:24px; bottom:-4px; width:1.5px; background:var(--line-strong);}
.tl-item:last-child:before{display:none;}
.tl-dot{width:27px; height:27px; border-radius:50%; background:var(--purple-tint); color:var(--purple); display:flex; align-items:center; justify-content:center; flex-shrink:0; z-index:1;}
.tl-dot svg{width:13px; height:13px; stroke:currentColor;}
.tl-body .ttl{font-size:12.5px; font-weight:600;}
.tl-body .meta{font-size:11px; color:var(--ink-faint); font-family:var(--font-mono); margin-top:1px;}
.tl-body p{font-size:12.5px; color:var(--ink-soft); margin:4px 0 0;}

@media (max-width:980px){
  #app{grid-template-columns:76px 1fr;}
  .rail-link span{display:none;}
  .rail-brand .name,.rail-brand .tag{display:none;}
  .kpi-row{grid-template-columns:repeat(2,1fr);}
  .flow-wrap{grid-template-columns:1fr;}
  .search-box{width:150px;}
}

/* ---- Advanced Score Dashboard ---- */
[data-asd]{cursor:pointer; transition:box-shadow .12s, transform .12s;}
[data-asd]:hover{box-shadow:0 0 0 2px var(--accent); transform:translateY(-1px);}
.asd-gauge-link{cursor:pointer; border-radius:12px; transition:background .12s;}
.asd-gauge-link:hover{background:var(--accent-tint);}
.asd-filters{display:flex; flex-direction:column; gap:8px; padding:12px; margin-bottom:18px;}
.asd-frow{display:flex; flex-wrap:wrap; gap:8px; align-items:center;}
.asd-filters select.on{border-color:var(--accent); background:var(--accent-tint); color:var(--purple); font-weight:600;}
.asd-flabel{font-size:11px; color:var(--ink-faint); font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.05em; margin-left:6px;}
.asd-chips{display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding-top:8px; border-top:1px solid var(--line);}
.asd-chips .asd-count{margin:0 6px 0 0;}
.asd-chip{display:inline-flex; align-items:center; gap:5px; padding:3px 7px 3px 10px; border-radius:100px; border:1px solid #DCCCF9; background:var(--accent-tint); color:var(--purple); font:inherit; font-size:11.5px; font-weight:600; cursor:pointer;}
.asd-chip svg{width:12px; height:12px; stroke:currentColor;}
.asd-chip:hover{background:#EBE0FD;}
.asd-hint{font-size:11.5px; color:var(--ink-faint);}
.asd-kpis{grid-template-columns:repeat(5,minmax(0,1fr));}
.asd-kpis .value{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.asd-two{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.asd-box{padding:16px 18px;}
.asd-seg{display:inline-flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; margin-left:4px;}
.asd-seg button{border:none; background:var(--surface); padding:5px 11px; font:inherit; font-size:12px; font-weight:500; color:var(--ink-soft); cursor:pointer; border-right:1px solid var(--line);}
.asd-seg button:last-child{border-right:none;}
.asd-seg button.on{background:var(--purple); color:#fff;}
.asd-mstats{display:flex; justify-content:space-between; font-size:10.5px; color:var(--ink-faint); margin-top:2px;}
.asd-low{margin-top:8px; padding-top:7px; border-top:1px dashed var(--line);}
.asd-low .lbl{font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); font-family:var(--font-mono); margin-bottom:3px;}
.asd-low button{display:flex; width:100%; justify-content:space-between; gap:8px; border:none; background:none; padding:3px 4px; margin:0 -4px; border-radius:5px; font:inherit; font-size:11.5px; color:var(--ink-soft); cursor:pointer; text-align:left;}
.asd-low button:hover{background:var(--accent-tint); color:var(--purple);}
.asd-low button span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.asd-search{width:auto; flex:1 1 280px; background:var(--surface);}
.asd-filters select{padding:7px 9px; border:1px solid var(--line); border-radius:7px; font:inherit; font-size:12.5px; background:var(--surface); color:var(--ink); cursor:pointer; max-width:190px;}
.asd-count{margin-left:auto; font-size:11.5px; color:var(--ink-faint);}
.asd-sub{font-family:var(--font-ui); font-size:11.5px; font-weight:400; color:var(--ink-faint); text-transform:none; letter-spacing:0; margin-left:6px;}
.asd-srcavg{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; margin-bottom:6px;}
.asd-srcavg-card{padding:11px 13px;}
.asd-srcavg-card .nm{font-size:11.5px; color:var(--ink-soft); min-height:32px; line-height:1.35;}
.asd-srcavg-card .v{font-size:22px; font-weight:700; margin:2px 0 6px;}
.asd-track{height:5px; background:var(--line); border-radius:9px; overflow:hidden;}
.asd-track span{display:block; height:100%; border-radius:9px;}
.asd-heat{display:inline-flex; align-items:center; justify-content:center; min-width:32px; height:22px; padding:0 5px; border-radius:5px; font-family:var(--font-mono); font-weight:700; font-size:11.5px;}
.asd-table th{font-size:11px;}
.asd-table td{white-space:nowrap; padding:9px 8px;}
.asd-table td .n{white-space:nowrap;}
.asd-hero .btn{white-space:nowrap;}
.asd-table th.asd-sort{cursor:pointer; user-select:none;}
.asd-table th.asd-sort:hover{color:var(--ink);}
.asd-table th.asd-sort.on{color:var(--purple);}
.asd-table th.asd-sort.on::after{content:' ↑';}
.asd-layout{display:grid; grid-template-columns:250px minmax(0,1fr); gap:16px; align-items:start;}
.asd-list{position:sticky; top:0; max-height:calc(100vh - 180px); display:flex; flex-direction:column; overflow:hidden;}
.asd-list-head{padding:10px 14px; font-size:11px; color:var(--ink-faint); border-bottom:1px solid var(--line); text-transform:uppercase; letter-spacing:.05em;}
.asd-list-items{overflow-y:auto; padding:6px;}
.asd-li{display:flex; width:100%; align-items:center; justify-content:space-between; gap:8px; padding:8px 9px; border:none; background:none; border-radius:7px; cursor:pointer; text-align:left; font:inherit;}
.asd-li:hover{background:var(--surface-2);}
.asd-li.on{background:var(--accent-tint); box-shadow:inset 3px 0 0 var(--accent);}
.asd-li .nm{font-size:12.5px; font-weight:600; color:var(--ink); display:flex; flex-direction:column; min-width:0;}
.asd-li .nm .s{font-size:10.5px; font-weight:400; color:var(--ink-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.asd-main{min-width:0;}
.asd-hero{display:grid; grid-template-columns:minmax(250px,1fr) auto minmax(280px,1.3fr); gap:22px; padding:18px 20px; align-items:center;}
.asd-facts{display:grid; grid-template-columns:1fr 1fr; gap:8px 16px; margin-top:14px; font-size:12.5px;}
.asd-facts span{display:block; color:var(--ink-faint); font-size:11px;}
.asd-chart-title{font-size:12px; font-weight:600; color:var(--ink-soft); display:flex; align-items:center; gap:8px; margin-bottom:4px;}
.asd-chart-title span{display:inline-flex; align-items:center; gap:4px; font-weight:400; color:var(--ink-faint);}
.asd-stack{display:flex; height:22px; border-radius:6px; overflow:hidden; background:var(--line);}
.asd-stack span{display:block; height:100%; border-right:1px solid var(--surface);}
.asd-stack span.gap{background:repeating-linear-gradient(135deg, var(--line) 0 5px, var(--surface-2) 5px 10px);}
.asd-legend{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:6px 18px; margin-top:12px; font-size:12px; color:var(--ink-soft);}
.asd-legend div{display:flex; align-items:center; gap:7px;}
.asd-legend i{width:10px; height:10px; border-radius:3px; flex-shrink:0;}
.asd-legend b{margin-left:auto; color:var(--ink);}
.asd-legend span{color:var(--ink-faint); font-size:11px; width:40px; text-align:right;}
.asd-insight{display:flex; gap:10px; padding:14px 16px; margin-top:14px; background:var(--accent-tint); border-color:#E4D8FB;}
.asd-insight svg{width:17px; height:17px; stroke:currentColor;}
.asd-insight p{margin:0; font-size:12.8px; color:var(--ink-soft);}
.asd-src-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(172px,1fr)); gap:10px;}
.asd-src{padding:11px 13px; text-align:left; cursor:pointer; font:inherit; color:inherit; transition:border-color .12s, box-shadow .12s;}
.asd-src:hover{border-color:var(--accent);}
.asd-src.on{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-tint), 0 0 0 1px var(--accent);}
.asd-src .top{display:flex; justify-content:space-between; gap:6px; font-size:11.5px;}
.asd-src .top .nm{font-weight:600; color:var(--ink);}
.asd-src .top .wt{color:var(--ink-faint); font-size:10.5px; white-space:nowrap;}
.asd-src .mid{display:flex; align-items:baseline; gap:8px; margin:4px 0 6px;}
.asd-src .v{font-size:24px; font-weight:700;}
.asd-panel{padding:18px 20px; margin-top:14px;}
.asd-panel-head{display:flex; justify-content:space-between; gap:16px; margin-bottom:14px; flex-wrap:wrap;}
.asd-panel-head h3{font-size:16px;}
.asd-panel-head p{margin:3px 0 0; font-size:12.5px; color:var(--ink-faint);}
.asd-panel-stats{display:flex; gap:22px;}
.asd-panel-stats span{display:block; font-size:11px; color:var(--ink-faint);}
.asd-panel-stats b{font-size:19px;}
.asd-metric-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(245px,1fr)); gap:12px; margin-top:16px;}
.asd-metric{border:1px solid var(--line); border-radius:var(--radius-md); padding:12px 13px 9px; background:var(--surface-2);}
.asd-metric .top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
.asd-metric .nm{font-size:12.5px; font-weight:600;}
.asd-metric .hint{font-size:10.5px; color:var(--ink-faint); margin-top:1px;}
.asd-metric .mid{display:flex; align-items:baseline; gap:8px; margin:4px 0 2px;}
.asd-metric .v{font-size:19px; font-weight:700;}
.asd-metric .foot{display:flex; justify-content:space-between; font-size:10.5px; color:var(--ink-faint); margin-top:2px;}
@media (max-width:1100px){
  .asd-layout{grid-template-columns:1fr;}
  .asd-two{grid-template-columns:1fr;}
  .asd-kpis{grid-template-columns:repeat(2,1fr);}
  .asd-list{position:static; max-height:220px;}
  .asd-hero{grid-template-columns:1fr;}
}
</style>
</head>

/* ---------------------------- SEEDED RNG ---------------------------- */
function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(19820);
function ri(min,max){ return Math.floor(rng()*(max-min+1))+min; }
function pick(arr){ return arr[Math.floor(rng()*arr.length)]; }

function buildContacts(seedLen){

  return list.sort((a,b)=>a.daysAgo-b.daysAgo);

function buildScoreHistory(currentScore, trendDelta){
  // 6 monthly points ending near the current score, walking backward by roughly trendDelta/period with noise
  const pts = [currentScore];
  let v = currentScore;
  for(let i=0;i<5;i++){
    v = Math.max(5, Math.min(98, v - (trendDelta/5) + ri(-4,4)));
    pts.unshift(Math.round(v));
  }
  pts[pts.length-1] = currentScore;
  return pts.map((s,i)=>({month: i, score: s}));
}

const CUSTOMERS = [];
(function buildCustomers(){
  let ni = 0;
  LIFECYCLES.forEach((lc, li)=>{
    SEGMENTS.forEach((sg, si)=>{
      const count = 3; // 3 customers per one of the 12 segments = 36 total
      for(let i=0;i<count;i++){
        const name = COMPANY_NAMES[ni % COMPANY_NAMES.length]; ni++;
        // seeded source sub-scores, lightly biased by lifecycle position
        const bias = li===3 ? -6 : li===0 ? -4 : 4; // onboarding/renewal skew slightly lower/riskier
        const src = {};
        SOURCES.forEach(s=>{ src[s.key] = Math.max(5, Math.min(98, ri(28,96) + bias)); });
        const arrR = ARR_RANGE[sg];
        const cust = {
          id: 'c'+(ni),
          name, initials: initials(name),
          lifecycle: lc, segment: sg,
          arr: ri(arrR[0], arrR[1]),
          owner: OWNERS[ni % OWNERS.length],
          sources: src,
          lastMeetingDays: ri(1,75),
          lastLoginDays: ri(0,45),
          openTickets: ri(0,6),
          nps: ri(-40,80),
          renewalInDays: lc==='Renewal' ? ri(15,110) : ri(120,360),
          hygieneContacts: ri(2,9), hygieneTotal: ri(9,11),
          trendDelta: ri(-14,14),
        };
        cust.score = computeHealth(cust);
        cust.scoreHistory = buildScoreHistory(cust.score, cust.trendDelta);
        cust.contacts = buildContacts();
        cust.notes = buildNotes();
        cust.predictiveRisk = computePredictiveRisk(cust);
        CUSTOMERS.push(cust);
      }
    });
  });
})();

function computeHealth(cust){
  const w = WEIGHTS[scKey(cust.lifecycle, cust.segment)];
  let total = 0, wsum = 0;
  SOURCES.forEach(s=>{ total += (cust.sources[s.key]||0) * (w[s.key]||0); wsum += (w[s.key]||0); });
  return Math.round(wsum ? total/wsum : 0);
}
/* Predictive risk: a second, independent projection (0=high risk of churn, 100=safe) blending
   trend direction, ticket load and engagement recency — deliberately NOT the same formula as the
   rules-based health score, so the two can diverge and flag "about to become a problem" accounts. */
function computePredictiveRisk(cust){
  let r = 70;
  r += cust.trendDelta * 1.6;
  r -= cust.openTickets * 4;
  r -= Math.max(0, cust.lastMeetingDays - 30) * 0.35;
  r -= Math.max(0, cust.lastLoginDays - 20) * 0.4;
  r += (cust.nps/100) * 15;
  r += (cust.sources.telemetry - 60) * 0.25;
  return Math.max(2, Math.min(98, Math.round(r)));
}
function recalcAll(){
  CUSTOMERS.forEach(c=>{
    const prev = c.score;
    c.score = computeHealth(c);
    if(c.score !== prev){ c.scoreHistory.push({month: c.scoreHistory.length, score:c.score}); if(c.scoreHistory.length>12) c.scoreHistory.shift(); }
    c.predictiveRisk = computePredictiveRisk(c);
  });
}

const AGENT_RUNS = [];
const AUDIT_LOG = [];
const CURRENT_USER = 'Maya Chen';
let runSeq = 1;
function logAudit(action, detail){
  AUDIT_LOG.unshift({id:'log'+(AUDIT_LOG.length+1), actor:CURRENT_USER, action, detail, ts:Date.now()});
  if(AUDIT_LOG.length>200) AUDIT_LOG.pop();
}
function cloneSteps(steps){ return JSON.parse(JSON.stringify(steps)); }
function activeRunsFor(accountId){ return AGENT_RUNS.filter(r=>r.accountId===accountId && r.status==='active'); }
function hasCooldown(accountId, agentId){
  const pb = AGENTS.find(p=>p.id===agentId);
  const cooldownDays = pb ? pb.suppression.cooldownDays : 14;
  const recentlyDone = AGENT_RUNS.find(r=>r.accountId===accountId && r.agentId===agentId && r.status==='completed' && (Date.now()-r.completedAt) < cooldownDays*86400000);
  return !!recentlyDone;
}
function conflictReason(accountId, agent){
  const active = activeRunsFor(accountId);
  const sameActive = active.find(r=>r.agentId===agent.id);
  if(sameActive) return 'already active in this agent';
  const conflicting = active.find(r=>agent.suppression.conflictsWith.includes(r.agentId));
  if(conflicting) return `already active in "${conflicting.agentName}" (conflicting agent)`;
  if(hasCooldown(accountId, agent.id)) return 'completed this agent recently — in cooldown';
  return null;
}
function launchAgentRuns(agent, accounts, audienceName){
  const launched = [], skipped = [];
  accounts.forEach(acc=>{
    const reason = conflictReason(acc.id, agent);
    if(reason){ skipped.push({account:acc, reason}); return; }
    const steps = cloneSteps(agent.steps);
    const run = {
      id:'run'+(runSeq++), agentId:agent.id, agentName:agent.name,
      accountId:acc.id, accountName:acc.name, owner:acc.owner,
      audienceName: audienceName||'Manual launch',
      steps, currentIndex:0, status:'active', startedAt:Date.now(), completedAt:null,
      targetMetric: agent.targetMetric, metricAtLaunch: acc.sources[agent.targetMetric], scoreAtLaunch: acc.score,
    };
    AGENT_RUNS.push(run);
    launched.push(acc);
  });
  logAudit('Launched agent', `${agent.name} → ${launched.length} account${launched.length===1?'':'s'}${skipped.length?`, ${skipped.length} skipped (orchestration rules)`:''}`);
  return {launched, skipped};
}
/* Seeds historical (already-completed) runs so Agent Analytics has real substance on first load,
   instead of an empty dashboard until the team has actually launched agents for a while.
   Each run's "metricAtLaunch" is set slightly below the account's CURRENT tagged-metric value —
   so analytics always computes the lift live from actual customer data, never a hardcoded number. */
function seedHistoricalRuns(){
  AGENTS.forEach(agent=>{
    const runCount = ri(4, 9);
    for(let i=0;i<runCount;i++){
      const acc = pick(CUSTOMERS);
      const metricNow = acc.sources[agent.targetMetric];
      const lift = ri(-6, 24); // mostly positive outcomes, occasional flat/negative for realism
      const metricAtLaunch = Math.max(4, Math.min(96, metricNow - lift));
      const scoreLift = Math.round(lift * (WEIGHTS[scKey(acc.lifecycle, acc.segment)][agent.targetMetric]/100));
      const startedDaysAgo = ri(10, 170);
      const durationDays = ri(3, Math.min(startedDaysAgo, 30));
      const outcome = lift >= 8 ? 'resolved' : lift >= 0 ? 'improved' : 'no change';
      AGENT_RUNS.push({
        id:'run'+(runSeq++), agentId:agent.id, agentName:agent.name,
        accountId:acc.id, accountName:acc.name, owner:acc.owner,
        audienceName:'Historical', steps:cloneSteps(agent.steps), currentIndex:agent.steps.length, status:'completed',
        startedAt: Date.now()-startedDaysAgo*86400000, completedAt: Date.now()-(startedDaysAgo-durationDays)*86400000,
        targetMetric: agent.targetMetric, metricAtLaunch, scoreAtLaunch: Math.max(5, Math.min(99, acc.score - scoreLift)),
        outcome,
      });
    }
  });
}
seedHistoricalRuns();
function agentAnalytics(agentId){
  const runs = AGENT_RUNS.filter(r=>r.agentId===agentId);
  const completed = runs.filter(r=>r.status==='completed');
  const withDelta = runs.map(r=>{
    const acc = CUSTOMERS.find(c=>c.id===r.accountId);
    const metricNow = acc ? acc.sources[r.targetMetric] : r.metricAtLaunch;
    const scoreNow = acc ? acc.score : r.scoreAtLaunch;
    return {run:r, account:acc, metricLift: metricNow - r.metricAtLaunch, scoreLift: scoreNow - r.scoreAtLaunch, metricNow, scoreNow};
  });
  const avg = arr => arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : 0;
  return {
    runs, completed: completed.length, entered: runs.length,
    completionRate: runs.length ? Math.round(completed.length/runs.length*100) : 0,
    avgMetricLift: avg(withDelta.map(d=>d.metricLift)),
    avgScoreLift: avg(withDelta.map(d=>d.scoreLift)),
    improved: withDelta.filter(d=>d.metricLift>0).length,
    details: withDelta.sort((a,b)=>b.run.startedAt-a.run.startedAt),
  };
}
/* The step a run is currently waiting on. Condition branches are spliced directly into run.steps
   the moment they're resolved, so this is always just a simple linear pointer — no separate tree walk needed. */
function currentRunStep(run){ return run.steps[run.currentIndex]; }
function advanceRun(runId, branchTaken){
  const run = AGENT_RUNS.find(r=>r.id===runId);
  if(!run || run.status!=='active') return;
  const cur = run.steps[run.currentIndex];
  if(!cur) return;
  cur.done = true;
  if(cur.type==='condition'){
    const branch = branchTaken || 'yes';
    cur._takenBranch = branch;
    const chosen = cloneSteps(cur.config[branch] || []);
    if(chosen.length) run.steps.splice(run.currentIndex+1, 0, ...chosen);
  }
  run.currentIndex += 1;
  if(run.currentIndex >= run.steps.length){ run.status='completed'; run.completedAt=Date.now(); logAudit('Agent run completed', `${run.agentName} for ${run.accountName}`); }
}
(function seedAgentRuns(){

/* ---------------------------- RISK RADAR (AI root-cause + recommendation) ---------------------------- */
const SOURCE_TO_AGENT = {
  telemetry:'pb4', survey:'pb2', meetings:'pb6', tickets:'pb8', renewal:'pb7', crm:'pb6', hygiene:'pb1',
};
function generateRootCause(c){
  const w = WEIGHTS[scKey(c.lifecycle, c.segment)];
  // weakest weighted contributor = lowest (source score * weight), i.e. what's dragging the score down the most
  let worst = null, worstImpact = -Infinity;
  SOURCES.forEach(s=>{
    const gap = (100 - c.sources[s.key]) * (w[s.key]/100); // points lost to this source
    if(gap > worstImpact){ worstImpact = gap; worst = s; }
  });
  const divergence = c.score - c.predictiveRisk;
  const rising = divergence > 12;
  const pbId = SOURCE_TO_AGENT[worst.key] || 'pb4';
  const pb = AGENTS.find(p=>p.id===pbId);
  let sentence = `${worst.name} is the weakest signal (scoring ${c.sources[worst.key]}/100, weighted ${w[worst.key]}% for this scorecard) — the largest single drag on this account's health.`;
  if(rising) sentence += ` Predictive risk (${c.predictiveRisk}) is already running well below the current score, suggesting this will get worse before it shows up in the health score.`;
  return {reason:sentence, driver:worst, recommendedAgent:pb, rising};
}
function riskRadarCandidates(){
  return CUSTOMERS
    .filter(c=>!state.riskRadarDismissed.includes(c.id))
    .filter(c=> custBand(c).key==='atrisk' || custBand(c).key==='critical' || (c.score - c.predictiveRisk) > 12)
    .map(c=>({customer:c, ...generateRootCause(c)}))
    .sort((a,b)=> (a.customer.score - a.customer.predictiveRisk) < (b.customer.score - b.customer.predictiveRisk) ? 1 : a.customer.score - b.customer.score);
}
/* Manage Risk: group flagged accounts by their single biggest drag source, so a CSM sees
   "14 accounts, Low Product Usage, run Adoption Risk" instead of 14 separate cards. */

  survey:{label:'Negative Sentiment', desc:'Survey and NPS responses are trending negative.'},
  meetings:{label:'Disengaged Relationship', desc:'Meeting cadence and engagement with the account team has dropped off.'},
  tickets:{label:'Support Friction', desc:'Ticket volume or severity is weighing on the relationship.'},

function riskTypeGroups(){
  const map = {};
  riskRadarCandidates().forEach(item=>{

    map[k].items.push(item);

}

function sparklineSvg(history){
  const w=260, h=54, pad=6;
  const values = history.map(p=>p.score);
  const min = Math.min(...values), max = Math.max(...values), range = Math.max(1, max-min);
  const pts = values.map((v,i)=>{
    const x = pad + i*(w-2*pad)/(values.length-1);
    const y = h-pad - (v-min)/range*(h-2*pad);
    return [x,y];
  });
  const color = values[values.length-1] >= values[0] ? 'var(--thriving)' : 'var(--critical)';
  const poly = pts.map(p=>p.join(',')).join(' ');
  const last = pts[pts.length-1];
  return `<svg class="sparkline" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">
    <polyline points="${poly}" fill="none" stroke="${color}" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="${color}"/>
  </svg>`;
}

function describeStep(s){
  if(!s) return 'complete';
  if(s.type==='email') return (s.config.requiresApproval?'approve & send "':'send "')+s.config.template+'"';
  if(s.type==='task') return s.config.title;
  if(s.type==='wait') return 'wait '+s.config.duration+' '+s.config.unit;
  if(s.type==='condition') return 'check '+s.config.field;
  if(s.type==='api') return 'call '+s.config.endpoint;
  if(s.type==='sms') return 'text: "'+s.config.message+'"';
  if(s.type==='slack') return 'notify '+(s.config.channel||'Slack')+': "'+s.config.message+'"';
  return '';
}

function renderManageRiskTab(body){

  if(groups.length===0){
    body.innerHTML = `<div class="empty-state">${ICON.sparkle}<h4>Nothing flagged right now</h4><p>Zeke will group accounts here by risk type the moment a health score or predictive-risk divergence shows up.</p></div>`;
    return;
  }
  body.innerHTML = groups.map(g=>{
    const open = state.expandedRiskType===g.key;
    return `<div class="card" style="padding:20px; margin-bottom:14px;">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap;">
        <div style="display:flex; gap:14px; align-items:flex-start;">
          <div class="score-badge" style="width:44px; height:44px; border-radius:10px; background:var(--critical-tint); color:var(--critical); font-size:17px;">${g.items.length}</div>
          <div>
            <div style="font-weight:700; font-size:15.5px; font-family:var(--font-display);">${g.meta.label}</div>
            <div style="font-size:12.5px; color:var(--ink-soft); margin-top:3px; max-width:440px;">${g.meta.desc}</div>
            <div style="font-size:12px; margin-top:8px;"><span style="color:var(--ink-faint);">Suggested agent:</span> <b>${g.agent.name}</b></div>
          </div>
        </div>
        <div style="display:flex; gap:8px; flex-shrink:0;">
          <button class="btn btn-sm" data-toggle-risk="${g.key}">${open?ICON.chevronDown:ICON.arrowRight}${open?'Hide accounts':'View accounts'}</button>
          <button class="btn btn-sm btn-accent" data-bulk-risk="${g.key}">${ICON.play}Run ${g.agent.name} for all ${g.items.length}</button>
        </div>
      </div>
      ${open ? `<div style="margin-top:16px; padding-top:14px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:8px;">
        ${g.items.map(it=>{
          const c = it.customer, band = custBand(c);
          return `<div style="display:flex; justify-content:space-between; align-items:center; gap:12px; padding:9px 12px; background:var(--surface-2); border-radius:8px; flex-wrap:wrap;">
            <div style="display:flex; gap:10px; align-items:center;">
              <div class="avatar">${c.initials}</div>
              <div>
                <div style="font-weight:600; font-size:13px;">${c.name}</div>
                <div style="font-size:11px; color:var(--ink-faint);">${c.lifecycle} · ${c.segment} · Owner ${c.owner}${it.rising?' · rising risk':''}</div>
              </div>
            </div>
            <div style="display:flex; gap:8px; align-items:center;">
              <span class="score-badge" data-asd="${c.id}" title="Open Advanced Score Dashboard" style="background:${band.tint}; color:${band.color};">${c.score}</span>
              <button class="btn btn-sm" data-viewacct="${c.id}">${ICON.eye}View</button>
              <button class="btn btn-sm" data-dismiss="${c.id}">${ICON.x}Dismiss</button>
              <button class="btn btn-sm btn-accent" data-approve="${c.id}" data-pb="${it.recommendedAgent.id}">${ICON.check}Approve &amp; launch</button>
            </div>
          </div>`;
        }).join('')}
      </div>` : ''}
    </div>`;
  }).join('');

  body.querySelectorAll('[data-toggle-risk]').forEach(b=>b.addEventListener('click', ()=>{
    state.expandedRiskType = state.expandedRiskType===b.dataset.toggleRisk ? null : b.dataset.toggleRisk;
    renderRiskRadar();
  }));
  body.querySelectorAll('[data-viewacct]').forEach(b=>b.addEventListener('click', ()=>openCustomerDrawer(b.dataset.viewacct)));
  body.querySelectorAll('[data-dismiss]').forEach(b=>b.addEventListener('click', ()=>{ state.riskRadarDismissed.push(b.dataset.dismiss); renderRiskRadar(); refreshNavBadges(); }));
  body.querySelectorAll('[data-approve]').forEach(b=>b.addEventListener('click', ()=>{
    const c = CUSTOMERS.find(x=>x.id===b.dataset.approve);
    const pb = AGENTS.find(p=>p.id===b.dataset.pb);
    const reason = conflictReason(c.id, pb);
    if(reason){ toast(`Can't launch — ${c.name} is ${reason}.`, 'x'); return; }
    showModal(`
      <h3>Approve Zeke's recommendation?</h3>
      <div style="font-size:12.5px; color:var(--ink-soft); margin-bottom:16px;">This will launch <b>${pb.name}</b> for <b>${c.name}</b> and add its first step to your work queue.</div>
      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button class="btn" id="modalCancel">Cancel</button>
        <button class="btn btn-accent" id="modalApprove">${ICON.check}Approve & launch</button>
      </div>
    `);
    document.getElementById('modalCancel').addEventListener('click', closeModal);
    document.getElementById('modalApprove').addEventListener('click', ()=>{
      launchAgentRuns(pb, [c], 'Drive Outcome — Manage Risk (AI-recommended)');
      state.riskRadarDismissed.push(c.id);
      closeModal(); renderRiskRadar(); refreshNavBadges();
      toast(`${pb.name} launched for ${c.name}.`, 'play');
    });
  }));
  body.querySelectorAll('[data-bulk-risk]').forEach(b=>b.addEventListener('click', ()=>{
    const g = riskTypeGroups().find(x=>x.key===b.dataset.bulkRisk);
    if(!g) return;
    const customers = g.items.map(it=>it.customer);
    const conflicts = customers.filter(c=>conflictReason(c.id, g.agent)).length;
    showModal(`
      <h3>Run ${g.agent.name} for ${g.meta.label}?</h3>
      <div style="font-size:12.5px; color:var(--ink-soft); margin-bottom:8px;">This launches <b>${g.agent.name}</b> for all <b>${customers.length}</b> accounts flagged with this risk type.</div>
      <div style="font-size:11.5px; color:var(--ink-faint); margin-bottom:16px;">${conflicts ? `${conflicts} of ${customers.length} are already mid-sequence or in cooldown and will be skipped.` : `No orchestration conflicts — all ${customers.length} will be enrolled.`}</div>
      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button class="btn" id="modalCancel">Cancel</button>
        <button class="btn btn-accent" id="modalBulkRisk">${ICON.play}Launch for all</button>
      </div>
    `);
    document.getElementById('modalCancel').addEventListener('click', closeModal);
    document.getElementById('modalBulkRisk').addEventListener('click', ()=>{
      const {launched} = launchAgentRuns(g.agent, customers, 'Drive Outcome — Manage Risk (bulk)');
      launched.forEach(c=>state.riskRadarDismissed.push(c.id));
      closeModal(); renderRiskRadar(); refreshNavBadges();
      toast(`${g.agent.name} launched for ${launched.length} of ${customers.length} accounts.`, 'play');
    });
  }));
}

/* ---------------------------- MY WORK (CSM queue) ---------------------------- */
function pendingWorkItems(){
  return AGENT_RUNS.filter(r=>r.status==='active').map(r=>({run:r, step:currentRunStep(r)}))
    .filter(x=>x.step && (x.step.type==='task' || x.step.type==='condition' || (x.step.type==='email' && x.step.config.requiresApproval)));
}
function allActiveWorkItems(){
  return AGENT_RUNS.filter(r=>r.status==='active').map(r=>({run:r, step:currentRunStep(r)})).filter(x=>x.step);
}
function renderMyWork(){
  const el = document.getElementById('view-mywork');
  el.innerHTML = `
    <div class="view-head">
      <div><h1>Everything waiting on a person</h1><p>Every task, approval and decision across every running agent, in one queue — instead of buried inside eight separate sequences.</p></div>
    </div>
    <div class="tabs" id="workOwnerTabs"></div>
    <div id="workList"></div>
    <div class="section-title">${ICON.check}Recently completed</div>
    <div id="workCompleted" style="font-size:12.5px; color:var(--ink-soft);"></div>
  `;
  const ownerTabs = document.getElementById('workOwnerTabs');
  const owners = ['all', CURRENT_USER, ...OWNERS.filter(o=>o!==CURRENT_USER)];
  ownerTabs.innerHTML = owners.map(o=>`<button class="tab-btn" data-owner="${o}">${o==='all'?'Everyone':o===CURRENT_USER?'My items':o}</button>`).join('');
  ownerTabs.querySelectorAll('[data-owner]').forEach(b=>{
    b.classList.toggle('active', b.dataset.owner===state.myWorkFilter);
    b.addEventListener('click', ()=>{ state.myWorkFilter=b.dataset.owner; renderMyWork(); });
  });
  if(!owners.includes(state.myWorkFilter)) state.myWorkFilter='all';

  let items = allActiveWorkItems();
  if(state.myWorkFilter!=='all') items = items.filter(x=>x.run.owner===state.myWorkFilter);
  items.sort((a,b)=> workPriority(a.step)-workPriority(b.step));

  const list = document.getElementById('workList');
  if(items.length===0){
    list.innerHTML = `<div class="empty-state">${ICON.check}<h4>Queue is clear</h4><p>No active agent steps waiting on ${state.myWorkFilter==='all'?'anyone':'this owner'} right now.</p></div>`;
  } else {
    list.innerHTML = items.map(x=>workItemCard(x)).join('');
  }
  wireWorkItemEvents(list);

  const completed = AGENT_RUNS.filter(r=>r.status==='completed').sort((a,b)=>b.completedAt-a.completedAt).slice(0,6);
  document.getElementById('workCompleted').innerHTML = completed.length
    ? completed.map(r=>`<div style="padding:8px 0; border-bottom:1px solid var(--line);">${r.agentName} completed for <b>${r.accountName}</b> <span class="mono" style="color:var(--ink-faint);">· ${r.owner}</span></div>`).join('')
    : `<div style="color:var(--ink-faint);">Nothing completed yet this session.</div>`;
}
function workPriority(step){
  if(!step) return 9;
  if(step.type==='condition') return 0;
  if(step.type==='email' && step.config.requiresApproval) return 1;
  if(step.type==='task') return 2;
  if(step.type==='api') return 3;
  return 4; // wait
}
function workItemCard(x){
  const { run, step } = x;
  const st = STEP_STYLE[step.type];
  const c = CUSTOMERS.find(cu=>cu.id===run.accountId);
  const band = c ? custBand(c) : null;
  let actionHTML = '';
  let bodyHTML = '';
  if(step.type==='task'){
    bodyHTML = `<div class="ttl">${step.config.title}</div><div class="meta mono">Due ${step.config.offset} · ${run.owner}</div>`;
    actionHTML = `<button class="btn btn-sm btn-accent" data-complete="${run.id}">${ICON.check}Mark complete</button>`;
  } else if(step.type==='email'){
    const tpl = tplByName(step.config.template);
    bodyHTML = `<div class="ttl">${step.config.requiresApproval?'Needs approval: ':'Queued: '}"${step.config.template}"</div><div class="meta mono">${tpl?tpl.subject:''}</div>`;
    actionHTML = step.config.requiresApproval
      ? `<button class="btn btn-sm" data-reject="${run.id}">${ICON.x}Reject</button><button class="btn btn-sm btn-accent" data-complete="${run.id}">${ICON.check}Approve & send</button>`
      : `<button class="btn btn-sm btn-accent" data-complete="${run.id}">${ICON.mail}Mark sent</button>`;
  } else if(step.type==='wait'){
    bodyHTML = `<div class="ttl">Waiting ${step.config.duration} ${step.config.unit}</div><div class="meta mono">Automatic — resumes on its own</div>`;
    actionHTML = `<button class="btn btn-sm btn-ghost" data-complete="${run.id}">${ICON.arrowRight}Skip wait (demo)</button>`;
  } else if(step.type==='condition'){
    bodyHTML = `<div class="ttl">Decision needed: is "${step.config.field}" ${step.config.operator} ${step.config.value}?</div><div class="meta mono">Branches the rest of the sequence</div>`;
    actionHTML = `<button class="btn btn-sm" data-branch-no="${run.id}">No</button><button class="btn btn-sm btn-accent" data-branch-yes="${run.id}">Yes</button>`;
  } else if(step.type==='api'){
    bodyHTML = `<div class="ttl">Automated call: ${step.config.method} ${step.config.endpoint}</div><div class="meta mono">Fires automatically</div>`;
    actionHTML = `<button class="btn btn-sm btn-ghost" data-complete="${run.id}">${ICON.zap}Mark executed (demo)</button>`;
  } else if(step.type==='sms' || step.type==='slack'){
    bodyHTML = `<div class="ttl">Queued: ${step.type==='sms'?'SMS':'Slack'} — "${step.config.message||''}"</div><div class="meta mono">${run.owner}</div>`;
    actionHTML = `<button class="btn btn-sm btn-accent" data-complete="${run.id}">${ICON.check}Mark sent</button>`;
  }
  return `<div class="card" style="padding:13px 16px; margin-bottom:9px; display:flex; align-items:center; gap:14px;">
    <div class="ic" style="width:32px;height:32px;border-radius:7px;background:${st.bg};color:${st.fg};display:flex;align-items:center;justify-content:center;flex-shrink:0;">${ICON[st.icon]}</div>
    <div style="flex:1; min-width:0; cursor:pointer;" data-openacct="${run.accountId}">
      <div style="display:flex; gap:8px; align-items:center; margin-bottom:2px;">
        <span style="font-weight:600; font-size:12.5px;">${run.accountName}</span>
        ${band?`<span class="score-badge" data-asd="${c.id}" title="Open Advanced Score Dashboard" style="background:${band.tint}; color:${band.color}; width:30px; height:20px; font-size:11px;">${c.score}</span>`:''}
        <span style="font-size:11px; color:var(--ink-faint);">· ${run.agentName}</span>
      </div>
      ${bodyHTML}
    </div>
    <div style="display:flex; gap:6px; flex-shrink:0;">${actionHTML}</div>
  </div>`;
}
function wireWorkItemEvents(scope){
  scope.querySelectorAll('[data-openacct]').forEach(el=>el.addEventListener('click', ()=>openCustomerDrawer(el.dataset.openacct)));
  scope.querySelectorAll('[data-complete]').forEach(b=>b.addEventListener('click', (e)=>{
    e.stopPropagation();
    const run = AGENT_RUNS.find(r=>r.id===b.dataset.complete);
    const stepBefore = currentRunStep(run);
    advanceRun(run.id);
    logAudit('Step completed', `${describeStep(stepBefore)} — ${run.accountName} (${run.agentName})`);
    toast('Marked complete — moved to the next step.', 'check');
    renderMyWork(); refreshNavBadges();
  }));
  scope.querySelectorAll('[data-reject]').forEach(b=>b.addEventListener('click', (e)=>{
    e.stopPropagation();
    const run = AGENT_RUNS.find(r=>r.id===b.dataset.reject);
    run.status='completed'; run.completedAt=Date.now();
    logAudit('Email rejected', `${run.agentName} stopped for ${run.accountName} — email not approved`);
    toast('Email rejected — sequence stopped for this account.', 'x');
    renderMyWork(); refreshNavBadges();
  }));
  scope.querySelectorAll('[data-branch-yes]').forEach(b=>b.addEventListener('click', (e)=>{
    e.stopPropagation();
    const run = AGENT_RUNS.find(r=>r.id===b.dataset.branchYes);
    advanceRun(run.id, 'yes'); logAudit('Condition resolved', `${run.agentName} — ${run.accountName} → Yes branch`);
    renderMyWork(); refreshNavBadges();
  }));
  scope.querySelectorAll('[data-branch-no]').forEach(b=>b.addEventListener('click', (e)=>{
    e.stopPropagation();
    const run = AGENT_RUNS.find(r=>r.id===b.dataset.branchNo);
    advanceRun(run.id, 'no'); logAudit('Condition resolved', `${run.agentName} — ${run.accountName} → No branch`);
    renderMyWork(); refreshNavBadges();
  }));
}

/* ---------------------------- SCORECARDS ---------------------------- */
function renderScorecards(){
  const el = document.getElementById('view-scorecards');
  el.innerHTML = `
    <div class="view-head">
      <div><h1>12 scorecards, one model</h1><p>Every account is scored against the scorecard for its lifecycle stage and ARR segment — each with its own data-source weighting, tuned to what actually predicts health at that stage.</p></div>
    </div>
    <div class="matrix-wrap">
      <div></div>
      ${SEGMENTS.map(s=>`<div class="matrix-head">${s}</div>`).join('')}
      ${LIFECYCLES.map(l=>`
        <div class="matrix-row-label">${l}</div>
        ${SEGMENTS.map(s=>{
          const cs = CUSTOMERS.filter(c=>c.lifecycle===l && c.segment===s);
          const avg = Math.round(cs.reduce((a,c)=>a+c.score,0)/cs.length);
          const band = bandFor(avg, scKey(l,s));
          const counts = BANDS.map(b=>cs.filter(c=>bandFor(c.score, scKey(l,s)).key===b.key).length);
          return `<div class="sc-card" data-sc="${scKey(l,s)}">
            <div class="top"><span class="seg mono">${cs.length} accounts</span><span class="pill pill-${band.key}"><span class="pill-dot"></span>${band.label}</span></div>
            <div class="avg mono" style="color:${band.color}">${avg}</div>
            <div class="count">avg health score</div>
            <div class="dist-bar">${BANDS.map((b,i)=>counts[i]?`<span style="width:${counts[i]/cs.length*100}%; background:${b.color}"></span>`:'').join('')}</div>
          </div>`;
        }).join('')}
      `).join('')}
    </div>
  `;
  el.querySelectorAll('[data-sc]').forEach(card=>card.addEventListener('click', ()=>openScorecardDrawer(card.dataset.sc)));
}

function openScorecardDrawer(key){
  const [l,s] = key.split('|');
  const w = WEIGHTS[key];
  if(!THRESHOLDS[key]) THRESHOLDS[key] = defaultThresholds();
  const t = THRESHOLDS[key];

      document.getElementById('saveBands').disabled = !ok;

    };
    bandRows.querySelectorAll('[data-band-input]').forEach(inp=>inp.addEventListener('input', validateBands));
    validateBands();

    document.getElementById('drawerClose').addEventListener('click', closeDrawer);
    document.getElementById('resetWeights').addEventListener('click', ()=>{
      Object.assign(w, DEFAULT_WEIGHTS[l]); renderBody();
    });
    document.getElementById('saveWeights').addEventListener('click', ()=>{
      recalcAll(); logAudit('Scorecard weighting saved', `${l} · ${s}`); closeDrawer(); renderScorecards(); if(state.view==='dashboard') renderDashboard();

    document.getElementById('resetBands').addEventListener('click', ()=>{ Object.assign(t, defaultThresholds()); renderBody(); });
    document.getElementById('saveBands').addEventListener('click', ()=>{
      const {ok, draft} = validateBands();

      closeDrawer(); renderScorecards(); if(state.view==='dashboard') renderDashboard(); refreshNavBadges();
      toast(`${l} · ${s} health bands updated.`,'check');
    });
    drawer.querySelectorAll('[data-cust2]').forEach(tr=>tr.addEventListener('click', ()=>{ closeDrawer(); setTimeout(()=>openCustomerDrawer(tr.dataset.cust2),180); }));
  };
  renderBody();
  drawer.classList.add('show');
}

/* ---------------------------- AUDIENCE CREATOR ---------------------------- */
const AUD_FIELDS = [
  {key:'lifecycle', label:'Lifecycle Stage', type:'enum', options:LIFECYCLES},
  {key:'segment', label:'ARR Segment', type:'enum', options:SEGMENTS},
  {key:'band', label:'Health Category', type:'enum', options:BANDS.map(b=>b.key), display:k=>BANDS.find(b=>b.key===k).label},
  {key:'score', label:'Health Score', type:'number'},
  {key:'predictiveRisk', label:'Predictive Risk Score', type:'number'},
  {key:'owner', label:'CSM Owner', type:'enum', options:OWNERS},
  {key:'lastMeetingDays', label:'Last Meeting (days ago)', type:'number'},
  {key:'lastLoginDays', label:'Last Login (days ago)', type:'number'},
  {key:'openTickets', label:'Open Tickets', type:'number'},
  {key:'nps', label:'NPS Score', type:'number'},
  {key:'renewalInDays', label:'Renewal In (days)', type:'number'},
  {key:'arr', label:'ARR ($)', type:'number'},
];
function fieldMeta(k){ return AUD_FIELDS.find(f=>f.key===k); }
function fieldLabel(k){ return fieldMeta(k) ? fieldMeta(k).label : k; }
function filterChipText(f){
  const m = fieldMeta(f.field);
  const opTxt = {is:'is', isnot:'is not', lt:'<', gt:'>', eq:'='}[f.op] || f.op;
  const val = m && m.type==='enum' && m.display ? m.display(f.value) : f.value;
  return `${m?m.label:f.field} ${opTxt} ${val}`;
}
function matchCondition(c, f){
  const m = fieldMeta(f.field);
  if(f.field==='band'){ const b = custBand(c).key; return f.op==='isnot' ? b!==f.value : b===f.value; }
  if(m && m.type==='enum'){ return f.op==='isnot' ? c[f.field]!==f.value : c[f.field]===f.value; }
  const cv = c[f.field]; const fv = Number(f.value);
  if(f.op==='lt') return cv < fv;
  if(f.op==='gt') return cv > fv;
  return cv === fv;
}
/* groups: array of AND-groups; a customer matches if it satisfies ANY group ("OR" between groups,
   "AND" within a group) — e.g. [[Enterprise, AtRisk], [RenewalIn<30]] reads as
   "(Enterprise AND At Risk) OR (Renewal in under 30 days)". */
function matchCustomer(c, groups){
  if(!groups || groups.length===0) return true;
  return groups.some(g => g.length===0 ? true : g.every(f=>matchCondition(c,f)));
}
function runAudience(groups){ return CUSTOMERS.filter(c=>matchCustomer(c, groups)); }
/* A saved audience is either dynamic (recomputed live from its groups every time it's used —
   the default) or static (frozen to the exact account list at the moment it was saved). */
function resolveAudience(a){
  if(a.dynamic===false) return (a.customerIds||[]).map(id=>CUSTOMERS.find(c=>c.id===id)).filter(Boolean);
  return runAudience(a.groups);
}
function cloneGroups(groups){ return groups.map(g=>g.map(f=>({...f}))); }

function renderAudience(){
  const el = document.getElementById('view-audience');
  el.innerHTML = `
    <div class="view-head">
      <div><h1>Build the right list, not another spreadsheet</h1><p>Save every audience to the library for quick reuse, filter manually with AND/OR logic, or describe who you want in plain language.</p></div>
      <div class="view-actions">
        <button class="btn btn-primary" id="newAudBtn">${ICON.plus}New audience</button>
      </div>
    </div>
    <div class="tabs" id="audTopTabs"></div>
    <div id="audTopBody"></div>
  `;
  document.getElementById('newAudBtn').addEventListener('click', ()=>{
    state.audienceGroups = [[{field:'lifecycle', op:'is', value:'Adoption'}]];
    state.audienceTab='manual'; state.audienceTopTab='builder'; renderAudience();
  });
  const topTabs = document.getElementById('audTopTabs');
  const tabDefs = state.audienceTopTab==='builder' ? [['builder','Builder']] : [['library','Library']];
  topTabs.innerHTML = tabDefs.map(([k,l])=>`<button class="tab-btn" data-audtoptab="${k}">${l}</button>`).join('');
  topTabs.querySelectorAll('[data-audtoptab]').forEach(b=>{
    b.classList.toggle('active', b.dataset.audtoptab===state.audienceTopTab);
    b.addEventListener('click', ()=>{ state.audienceTopTab=b.dataset.audtoptab; renderAudience(); });
  });
  const body = document.getElementById('audTopBody');
  if(state.audienceTopTab==='library') renderAudienceLibrary(body); else renderAudienceBuilderShell(body);
}

function renderAudienceLibrary(body){
  if(AUDIENCES.length===0){
    body.innerHTML = `<div class="empty-state">${ICON.target}<h4>No saved audiences yet</h4><p>Build one manually or with Ask Zeke, then save it here for one-click reuse.</p></div>`;
    return;
  }
  body.innerHTML = `<div class="pb-grid" id="audLibGrid"></div>`;
  const grid = document.getElementById('audLibGrid');
  grid.innerHTML = AUDIENCES.map(a=>{
    const n = resolveAudience(a).length;
    const flatConditions = (a.groups||[]).flat();
    const preview = flatConditions.slice(0,3).map(f=>filterChipText(f));
    const groupNote = (a.groups||[]).length>1 ? ` across ${a.groups.length} OR groups` : '';
    return `<div class="pb-card" data-audcard="${a.id}">
      <span class="pill ${a.dynamic===false?'pill-neutral':'pill-thriving'} cat"><span class="pill-dot"></span>${a.dynamic===false?'Static snapshot':'Live'}</span>
      <h4>${a.name}</h4>
      <div class="p-chip-row" style="display:flex; flex-wrap:wrap; gap:6px;">${preview.map(t=>`<span class="chip">${t}</span>`).join('')}${flatConditions.length>3?`<span class="chip">+${flatConditions.length-3} more</span>`:''}</div>
      <div class="foot">
        <span class="mono"><b style="font-size:15px; color:var(--ink);">${n}</b> accounts${groupNote}</span>
        <span></span>
      </div>
      <div style="display:flex; gap:8px; margin-top:4px;">
        <button class="btn btn-sm" data-load="${a.id}">${ICON.arrowRight}Load</button>
        <button class="btn btn-sm btn-accent" data-launch="${a.id}">${ICON.play}Launch</button>
        <button class="btn btn-sm btn-ghost" style="color:var(--critical); margin-left:auto;" data-delaud="${a.id}">${ICON.x}</button>
      </div>
    </div>`;
  }).join('');
  grid.querySelectorAll('[data-load]').forEach(b=>b.addEventListener('click', (e)=>{ e.stopPropagation();
    const a = AUDIENCES.find(x=>x.id===b.dataset.load);
    state.audienceGroups = cloneGroups(a.groups && a.groups.length ? a.groups : [[]]);
    state.audienceTab='manual'; state.audienceTopTab='builder'; renderAudience();
  }));
  grid.querySelectorAll('[data-launch]').forEach(b=>b.addEventListener('click', (e)=>{ e.stopPropagation();
    const a = AUDIENCES.find(x=>x.id===b.dataset.launch);
    openLaunchModal(a.name, resolveAudience(a));
  }));
  grid.querySelectorAll('[data-delaud]').forEach(b=>b.addEventListener('click', (e)=>{ e.stopPropagation();
    const a = AUDIENCES.find(x=>x.id===b.dataset.delaud);
    showModal(`
      <h3>Delete "${a.name}"?</h3>
      <div style="font-size:12.5px; color:var(--ink-soft); margin-bottom:16px;">This removes it from the library. Any agents currently attached to it will need a new audience.</div>
      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button class="btn" id="modalCancel">Cancel</button>
        <button class="btn" style="color:var(--critical); border-color:var(--critical);" id="modalDeleteAud">${ICON.x}Delete</button>
      </div>
    `);
    document.getElementById('modalCancel').addEventListener('click', closeModal);
    document.getElementById('modalDeleteAud').addEventListener('click', ()=>{
      const i = AUDIENCES.findIndex(x=>x.id===a.id);
      if(i>-1) AUDIENCES.splice(i,1);
      logAudit('Audience deleted', a.name);
      closeModal(); renderAudience(); toast('Audience deleted.','x');
    });
  }));
}
